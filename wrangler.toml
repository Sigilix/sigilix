# ARC-190 env-var documentation (set via `wrangler secret put` or
# wrangler.toml [vars]):
#   OPENCLAW_PR_REVIEW_DO_MAX_RETRIES    # numeric; clamped [1, 10], default 3
#   OPENCLAW_PR_REVIEW_DO_WATCHDOG_MS    # numeric; clamped [60000, 1800000] ms, default 1200000 (20 min)
#   OPENCLAW_PR_REVIEW_DO_HISTORY_LIMIT  # numeric; clamped [1, 100], default 10
#
# SIG-184 runner-evidence ingest (POST /runner/ingest) — both UNSET for now; the
# route returns 503 until they're provided (values come from the Sigilix runner
# repo, PR 4). Non-secret → set in [vars] below or via the dashboard when ready:
#   SIGILIX_RUNNER_OIDC_AUDIENCE        # the `aud` the runner mints its OIDC token with
#   SIGILIX_RUNNER_WORKFLOW_REF         # pinned reusable-workflow `owner/repo/path` (no @ref)
# ARC-283 Phase B1b — shadow-mode model bake-off:
#   SHADOW_BAKEOFF_ROLES                 # CSV of "logic"|"security"|"performance"|"tests"|"synth"
#                                        # (default "" — shadow off everywhere). When set, the
#                                        # candidate lineup defined in lib/shadow-bakeoff-config.ts
#                                        # fires in parallel with prod on every PR review and emits
#                                        # `shadow-verdict-comparison` telemetry. Shadow output is
#                                        # NEVER posted to GitHub. Set via `wrangler secret put` for
#                                        # production, or the [vars] block below for local/preview.
#                                        # See docs/ops/shadow-bakeoff.md for rollout guidance.

# Plaintext env vars (non-secret). Secrets go through `wrangler secret
# put` instead — `[vars]` is for values that are safe to commit and
# need a default at deploy time.
[vars]
# Managed organization roles. The exact "on" value makes the active
# org_workspace_access row authoritative after fresh exact-installation
# visibility; unset/anything else preserves the legacy live-GitHub role path.
# Production activation requires every tenant to pass the operator backfill
# readiness check first. Emergency rollback reactivates the retained pre-flip
# Worker version: `npx wrangler rollback <version-id> --name sigilix --yes`.
OPENCLAW_ORG_MEMBERSHIP_MODE = "on"

# Gardener consolidation pass mode (#938). off (code default) | shadow (compute +
# log would-merge to the `memory-gardener-digest`, NO memory mutation) | enforce
# (write the canonical rule + tombstone the originals). Read raw off env like its
# sibling OPENCLAW_MEMORY_DECAY_MODE (which lives as a Cloudflare dashboard var).
# shadow = zero behavior change; the shadow->enforce flip is a deliberate gated
# decision after watching the digest. Adding this here does NOT wipe the
# dashboard-set memory flags (Workers Builds preserves them — proven by #935/#938).
OPENCLAW_MEMORY_CONSOLIDATE = "shadow"

# SIG-133: hybrid retrieval (vector + BM25/FTS5, fused via RRF). "on" activates
# the lexical leg for repos whose OPENCLAW_LEXICAL_INDEX corpus is populated (via
# (re)index); repos not yet re-indexed have an empty lexical table and stay
# vector-only (soft-empty → identical to today), so this is a safe gradual
# rollout. Read raw as env.OPENCLAW_RETRIEVAL_HYBRID by hybridRetrievalEnabled;
# also requires the OPENCLAW_LEXICAL_INDEX D1 binding (provisioned above).
OPENCLAW_RETRIEVAL_HYBRID = "on"

# SIG-234 (2026-05-26): bake-off DISABLED because production now runs
# the lineup that the bake-off was validating. The bake-off candidate
# config in `src/lib/shadow-bakeoff-config.ts` is preserved as a
# code-level record of Codex's ARC-292 analysis; flip back to a
# non-empty CSV ("synth", "synth,security,tests", etc.) to bake-off
