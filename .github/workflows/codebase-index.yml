name: Index codebase to Vectorize (reusable)

# Reusable workflow that other repos in the Arc-and-Anchor org call from
# their own `on: push` workflows to auto-reindex into the openclaw
# Vectorize index. The caller passes its repo via the standard checkout
# step; this workflow checks out the indexer separately, runs it
# against the caller's source tree, and upserts vectors into the
# namespace named after the calling repo (lowercased).
#
# Caller pattern (drop this into each tracked repo at
# `.github/workflows/openclaw-index.yml`):
#
#   name: OpenClaw codebase index
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:
#   jobs:
#     index:
#       uses: Arc-and-Anchor/openclaw-worker/.github/workflows/codebase-index.yml@main
#       secrets:
#         CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
#         CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
#
# The org-level secrets CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_AI_TOKEN
# (configured at https://github.com/organizations/Arc-and-Anchor/settings/secrets/actions)
# need to be made available to each repo that calls this. The token
# requires `Account → Workers AI → Read` and `Account → Vectorize → Edit`.

on:
  workflow_call:
    inputs:
      namespace:
        description: Vectorize namespace to upsert into. Defaults to the lowercased calling repo name.
        type: string
        required: false
        default: ""
      target_ref:
        description: Ref of the calling repo to index. Defaults to the ref that triggered the caller.
        type: string
        required: false
        default: ""
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          path: target-repo
          fetch-depth: 1

      - name: Checkout openclaw-worker (indexer source)
        uses: actions/checkout@v4
        with:
          repository: Arc-and-Anchor/openclaw-worker
          ref: main
          path: openclaw-worker
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: openclaw-worker/package-lock.json

      - name: Install indexer deps
        working-directory: openclaw-worker
        run: npm ci

      - name: Run indexer
        working-directory: openclaw-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Default the namespace to the caller's repo name (lowercased).
          # The indexer does its own lowercasing, but doing it here too
          # keeps the log line accurate and matches what `OPENCLAW_TEAM_REPO_MAP`
          # expects on the Worker side.
          NAMESPACE_INPUT="${{ inputs.namespace }}"
          if [ -z "$NAMESPACE_INPUT" ]; then
            NAMESPACE_INPUT="${{ github.event.repository.name }}"
          fi
          NAMESPACE_LOWER="$(printf '%s' "$NAMESPACE_INPUT" | tr '[:upper:]' '[:lower:]')"
          node scripts/index-repo.mjs ../target-repo --namespace="$NAMESPACE_LOWER"
