# Worker name — drives the deploy URL (e.g.
# `sigilix.<account>.workers.dev`) and is what GitHub / Linear webhook
# configs point at. Renamed from `openclaw-worker` during the Sigilix
# rebrand.
#
# sig-worker-debrand-openclaw: the OPENCLAW_ → SIGILIX_ rebrand of the Worker's
# config is done BACK-COMPAT via the bidirectional `normalizeEnv` shim
# (src/shared/util/normalize-env.ts), which resolves each OPENCLAW_/SIGILIX_ pair
# SIGILIX_-first with OPENCLAW_ fallback and mirrors the value under BOTH names.
#
# WHAT IS RENAMED HERE (this PR): every plain-text [vars] flag/mode is now under its
# canonical `SIGILIX_*` name. The ~1,600 call sites still read `env.OPENCLAW_<X>`;
# the shim mirrors each SIGILIX_ [vars] value back to the OPENCLAW_ name at every
# entry point, so those readers keep working with zero call-site edits.
#
# WHAT IS NOT RENAMED YET (deferred, coordinated follow-ups):
#   - BINDINGS: each KV/Queue/Vectorize binding is declared TWICE below — the legacy
#     `OPENCLAW_*` name AND the new `SIGILIX_*` name — both pointing at the SAME
#     underlying Cloudflare resource. The shim prefers the SIGILIX_ binding, falls
#     back to the OPENCLAW_ one.
#   - RESOURCE NAMES (`openclaw-code-index`, `boreas-agent-memory`, the KV namespace,
#     `openclaw-jobs`): NOT renamed — needs create-new + repoint + re-index.
#   - SECRETS (`wrangler secret put` values, documented at the end of [vars]): still
#     set under their OPENCLAW_ names; each must be re-set as SIGILIX_ (write-only) in
#     its own step. The shim keeps both names resolving throughout.
name = "sigilix"
main = "src/index.ts"

# Public API hostname (the sigilix.ai zone is on this Cloudflare account).
# workers.dev stays active as a legacy/fallback host during the transition.
# Keep the workers.dev subdomain ALIVE alongside the custom domain — the
# GitHub App + Linear webhooks (and older CLI configs) still point at it.
# Wrangler disables workers.dev by default once routes exist; this opts back in.
workers_dev = true

routes = [
  { pattern = "api.sigilix.ai", custom_domain = true }
]
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# Workers Trace Events Logpush opt-in — required for the
# sigilix-trace-events-r2 Logpush job (R2 bucket: sigilix-telemetry)
# to receive any data. Without this, the Worker emits zero records
# to the workers_trace_events dataset and the Logpush job pushes
# empty batches. Independent from the [observability] block below:
# both subscribe to the same upstream Trace Events stream but are
# billed separately (Logpush is a paid add-on; Workers Logs is
# included in Workers Paid).
logpush = true

# Workers Logs — in-dashboard searchable log viewer with 7-day
# retention. Mirror of the dashboard Observability toggle; wrangler
# is the source of truth at deploy time, so toggling in the dashboard
# alone would be reverted on next `wrangler deploy`.
[observability]
enabled = true
head_sampling_rate = 1

# Standard usage model — Bundled gives ctx.waitUntil() only ~30s of
# wall-clock budget after the response, which Ollama Turbo blows past
# routinely (its calls take 30-90s for a description rewrite). On
# Standard we get up to 30 min of waitUntil time and an explicit CPU
# budget in milliseconds, which is what the triage path needs.
#
# The legacy `usage_model = "unbound"` directive was removed in
# wrangler 4 and is silently ignored — the Worker was actually
# running on the Bundled default, which was killing waitUntil mid-
# triage and leaving every test issue with no comment / no rewrite.
[limits]
cpu_ms = 300000

# KV namespace for dedupe state.
# Stores marker comment IDs by issue identifier so re-firing
# webhooks edit-in-place instead of duplicating triage comments.
# Replaces the file-on-disk poll-state.json the Node daemon used.
#
# Run once: `wrangler kv:namespace create OPENCLAW_STATE`
# Then paste the returned ID below.
[[kv_namespaces]]
binding = "OPENCLAW_STATE"
id = "df689379ea6240f7808997a75ceaed7e"

# sig-worker-debrand-openclaw: SIGILIX_ alias for the SAME KV namespace (same id).
# normalizeEnv prefers this binding, falls back to OPENCLAW_STATE. Do NOT change
# the id — both names must resolve to the identical namespace so no data is orphaned.
[[kv_namespaces]]
binding = "SIGILIX_STATE"
id = "df689379ea6240f7808997a75ceaed7e"

# Vectorize index for codebase chunks. Embeddings are 768-dim vectors
# from Cloudflare's @cf/baai/bge-base-en-v1.5, indexed under one
# namespace per repo (e.g. "rubberfit", "rubberfit-desktop") so
# triage on a Linear issue can scope retrieval to the relevant repo.
#
# Run once: `wrangler vectorize create openclaw-code-index \
#   --dimensions=768 --metric=cosine`
# Then populate via scripts/index-repo.mjs (see README).
[[vectorize]]
binding = "OPENCLAW_CODE_INDEX"
index_name = "openclaw-code-index"

# sig-worker-debrand-openclaw: SIGILIX_ alias for the SAME Vectorize index.
# normalizeEnv prefers this binding, falls back to OPENCLAW_CODE_INDEX. The
# resource `openclaw-code-index` is intentionally NOT renamed here (rename =
# create-new + re-index, a coordinated follow-up).
[[vectorize]]
binding = "SIGILIX_CODE_INDEX"
index_name = "openclaw-code-index"

# SIG-483: Vectorize index for the local CLI agent's durable per-(user, repo)
# memories. Same 768-dim BGE embeddings + cosine metric as the code index, but
# isolated per tenant by the Vectorize namespace `<userId>/<repoId>` lowercased.
# Backs PUT /v1/memory + POST /v1/memory/query.
#
# Run once: `wrangler vectorize create boreas-agent-memory \
#   --dimensions=768 --metric=cosine`
[[vectorize]]
binding = "OPENCLAW_AGENT_MEMORY_INDEX"
index_name = "boreas-agent-memory"

# sig-worker-debrand-openclaw: SIGILIX_ alias for the SAME agent-memory Vectorize
# index. normalizeEnv prefers this binding, falls back to OPENCLAW_AGENT_MEMORY_INDEX.
# The resource `boreas-agent-memory` is intentionally NOT renamed here.
[[vectorize]]
binding = "SIGILIX_AGENT_MEMORY_INDEX"
index_name = "boreas-agent-memory"

# SIG-45: D1 database holding the FTS5 (BM25) lexical mirror of the code
# chunks for hybrid retrieval. The indexer dual-writes here alongside the
# Vectorize upsert; PR-review retrieval queries it in parallel with the
# vector index and fuses via RRF — all gated behind OPENCLAW_RETRIEVAL_HYBRID.
#
# SIG-133: ENABLED. D1 provisioned via `wrangler d1 create sigilix-lexical-index`.
# Schema is created lazily in code (ensureLexicalSchema) — no migration step, so
# Workers Builds `wrangler deploy` applies the binding with zero infra-job dep.
# The indexer dual-writes the FTS5 mirror on (re)index; the hybrid read fuses it
# with the vector leg via RRF once OPENCLAW_RETRIEVAL_HYBRID=on (see [vars]).
# Dual binding (OPENCLAW_ + SIGILIX_ alias) points at the SAME database_id,
# matching the KV/Vectorize/Queue pattern above.
[[d1_databases]]
binding = "OPENCLAW_LEXICAL_INDEX"
database_name = "sigilix-lexical-index"
database_id = "f5290fcd-02a6-4ed3-8efc-58e51b5c9fe4"

[[d1_databases]]
binding = "SIGILIX_LEXICAL_INDEX"
database_name = "sigilix-lexical-index"
database_id = "f5290fcd-02a6-4ed3-8efc-58e51b5c9fe4"

# SIG-343 PR C: platform store (tenant registry + repo registry + usage ledger).
# Applied via `wrangler d1 migrations apply sigilix-platform` (NOT auto on deploy).
# Binding is optional in code (SIGILIX_PLATFORM_DB?) so a deploy that hasn't
# provisioned/migrated this DB stays metering-off (dark) with no Worker crash.
[[d1_databases]]
binding = "SIGILIX_PLATFORM_DB"
database_name = "sigilix-platform"
database_id = "3b840a0e-e1b0-4cc7-9b8e-f06f7b4981b0"
migrations_dir = "migrations"

# sig-training-data-consent: the PHYSICALLY SEPARATE, consent-gated training
# corpus. COMMENTED OUT ON PURPOSE — the bucket is intentionally NOT provisioned
# at launch, so the SIGILIX_TRAINING_DATA binding is ABSENT and every write to the
# training store no-ops (retention is impossible even if the master flag were
# flipped). This is a DIFFERENT binding from every operational store — nothing in
# the review / learnings / chat / indexing paths references it — so non-consented
# data has no route in. Provision + uncomment ONLY after the legal prerequisites in
# src/features/training-consent/README.md are signed off:
#   1. `wrangler r2 bucket create sigilix-training-data`
#   2. uncomment the block below and redeploy
#   3. THEN, and only then, `wrangler secret put SIGILIX_TRAINING_RETENTION_MODE on`
# [[r2_buckets]]
# binding = "SIGILIX_TRAINING_DATA"
# bucket_name = "sigilix-training-data"

# Private transient image context for portal chat/research. The Worker enforces
# a server-set 23h logical expiry; the bucket lifecycle is configured at 24h so
# delayed physical cleanup can never extend application access.
[[r2_buckets]]
binding = "SIGILIX_CHAT_ATTACHMENTS"
bucket_name = "sigilix-chat-attachments"

# Cloudflare Workers AI binding — used for embedding the issue/comment
# body at query time. Keeps the embedding model identical between
# index time (CLI/CI script also calls @cf/baai/bge-base-en-v1.5 via
# the REST API) and retrieval time, which is critical for cosine sim
# to be meaningful.
[ai]
binding = "AI"

# Cloudflare Queue — `ctx.waitUntil()` has a hard 30s cap that's not
# configurable on any plan, and Ollama Turbo calls (Kimi/GLM) routinely
# take 30-90s. Webhooks now enqueue a JobMessage and return 200 fast
# (~50ms); the queue consumer below processes the job with up to 15
# minutes of wall-clock time per Cloudflare's documented limits.
#
# Run once before first deploy:
#   npx wrangler queues create openclaw-jobs
#
# Producer binding — the fetch handler `.send()`s here.
[[queues.producers]]
binding = "OPENCLAW_JOBS"
queue = "openclaw-jobs"

# sig-worker-debrand-openclaw: SIGILIX_ alias producer for the SAME queue.
# normalizeEnv prefers this binding, falls back to OPENCLAW_JOBS. The queue
# `openclaw-jobs` is intentionally NOT renamed here.
[[queues.producers]]
binding = "SIGILIX_JOBS"
queue = "openclaw-jobs"

# ARC-190: Durable Object for per-PR review-run state. Spec at
# docs/superpowers/specs/2026-05-07-arc-190-durable-objects-webhook-ingest-design.md.
# DO orchestrates dedupe + retry + watchdog for `pr-review` work; the
# existing OPENCLAW_JOBS queue still executes the actual review (DOs
# are time- and memory-capped, ensemble runs are 60-180s).
[[durable_objects.bindings]]
name = "PR_REVIEW_RUN"
class_name = "PrReviewRunDO"

# SIG-138: per-repo code/dependency graph stored in SQLite DO storage.
# Keyed by `indexNamespace(owner, repo)` (one DO instance per repo).
# Flag-gated behind SIGILIX_GRAPH_INDEX / SIGILIX_GRAPH_RETRIEVAL.
[[durable_objects.bindings]]
name = "REPO_GRAPH_DO"
class_name = "RepoGraphDO"

# SIG-119: single global DO holding rolling per-gate validator shadow
# telemetry (would-drop / kept daily buckets, 35-day retention). One
# instance (idFromName("global")); read via the authenticated
# GET /metrics/validation endpoint guarded by
# OPENCLAW_VALIDATION_METRICS_TOKEN.
[[durable_objects.bindings]]
name = "VALIDATION_METRICS_DO"
class_name = "ValidationMetricsDO"

# SIG-152: single global DO holding rolling daily aggregates of the SIG-138
# `pr-review-graph-retrieval` shadow sample (avg jaccard / added-context /
# blast counts, 35-day retention). Read via GET /metrics/graph (same
# OPENCLAW_VALIDATION_METRICS_TOKEN bearer).
[[durable_objects.bindings]]
name = "GRAPH_METRICS_DO"
class_name = "GraphMetricsDO"

# SIG-184: per-repo-sharded DO enforcing single-use of a runner-evidence receipt
# (repository_id, sha, run_id, run_attempt) + holding the defensible record
# (SQLite). Sharded by repository_id (idFromName). Not exercised until the
# OPENCLAW_RUNNER_* config is set.
[[durable_objects.bindings]]
name = "RUNNER_RECEIPT_DO"
class_name = "RunnerReceiptDO"

# SIG-184 PR 5b: single global DO holding rolling runner-evidence presence
# counters (state × evidence-pending-reason daily buckets + per-repo latest
# state, 35-day retention). Read via GET /metrics/runner-evidence (same
# OPENCLAW_VALIDATION_METRICS_TOKEN bearer as the other /metrics/* endpoints).
[[durable_objects.bindings]]
name = "RUNNER_EVIDENCE_METRICS_DO"
class_name = "RunnerEvidenceMetricsDO"

# SIG-107: single global DO holding accepted runner scan-manifest telemetry by
# deterministic tool/status. Read via GET /metrics/runner-tools (same
# OPENCLAW_VALIDATION_METRICS_TOKEN bearer as the other /metrics/* endpoints).
[[durable_objects.bindings]]
name = "RUNNER_TOOL_METRICS_DO"
class_name = "RunnerToolMetricsDO"

# SIG-285 PR 2: single global DO holding rolling verification-by-execution
# verdict counters (confirmed/refuted/inconclusive/no-check × category daily
# buckets, 35-day retention). Read via GET /metrics/verification (same
# OPENCLAW_VALIDATION_METRICS_TOKEN bearer).
[[durable_objects.bindings]]
name = "VERIFICATION_METRICS_DO"
class_name = "VerificationMetricsDO"

# SIG-286 PR2.5: single global DO holding rolling graph-context-expansion shadow
# aggregates (netNewTokens histogram → median, cross-file rates, fetch cost,
# 35-day retention). Read via GET /metrics/graph-expansion (same
# OPENCLAW_VALIDATION_METRICS_TOKEN bearer). Telemetry-only — nothing here
# changes a posted review.
[[durable_objects.bindings]]
name = "GRAPH_EXPANSION_METRICS_DO"
class_name = "GraphExpansionMetricsDO"

# SIG-455: per-tenant concurrency gate. One DO instance per tenant
# (idFromName(tenantKey)). Flag-gated behind SIGILIX_FAIRNESS_MODE.
[[durable_objects.bindings]]
name = "TENANT_CONCURRENCY"
class_name = "TenantConcurrencyDO"

# SIG-455 PR B: per-provider backpressure cooldown. One DO instance per
# provider slug (idFromName(providerSlug)). Flag-gated behind
# SIGILIX_PROVIDER_COOLDOWN_MODE.
[[durable_objects.bindings]]
name = "PROVIDER_COOLDOWN"
class_name = "ProviderCooldownDO"

# SIG-144 (Linear unification slice 1): LinearTokenBroker — owns the Linear agent
# token lifecycle + serializes refresh across isolates. Singleton DO instance
# (idFromName("linear-agent")). INERT this slice — bound + deployable, but no caller
# yet (buildLinearAgentClient / buildLinearAuth / webhooks still use the KV path).
[[durable_objects.bindings]]
name = "LINEAR_TOKEN_BROKER"
class_name = "LinearTokenBroker"

# SIG-298: DeepResearchDO — one DO instance per research run (crypto-random id
# from POST /v1/research). Owns the research loop + the buffered SSE transcript
# streamed from GET /v1/research/:id/stream. SQLite-backed.
[[durable_objects.bindings]]
name = "DEEP_RESEARCH"
class_name = "DeepResearchDO"

# sig-mcp-connections-p1: McpConnectionsAgent — one DO instance per seat
# (idFromName("session:<githubUserId>")) / tenant (idFromName("tenant:<installationId>")).
# Wraps the `agents` SDK's MCPClientManager: connect (+ OAuth), token storage
# (the SDK's own SQLite), list, disconnect for any user-supplied MCP server
# URL. SQLite-backed.
[[durable_objects.bindings]]
name = "MCP_CONNECTIONS"
class_name = "McpConnectionsAgent"

# SIG-545 B1: agent-runner Container DO (dark; gated by SIGILIX_AGENT_RUNNER_MODE).
# One DO instance per runId (idFromName(runId)). The Container is configured here
# but never dispatched to until the mode flag is flipped. The real Dockerfile and
# dispatch logic arrive in later tasks (B2/B3/B4).
[[durable_objects.bindings]]
name = "AGENT_RUNNER"
class_name = "AgentRunnerContainer"

# SIG-566: one globally-consistent, short-lived MCP capability object per
# agent run. Stores only the bearer digest + exact tenant/tool binding.
[[durable_objects.bindings]]
name = "AGENT_MCP_CAPABILITY"
class_name = "AgentMcpCapabilityDO"

# SIG-545 B1: Cloudflare Container binding for AgentRunnerContainer.
# instance_type "standard-1" = ½ vCPU, 4 GiB RAM, 8 GB disk (upgradeable
# to standard-2 for heavy repos). max_instances kept low for the dark rollout;
# bump once the feature is live and load is validated.
[[containers]]
class_name = "AgentRunnerContainer"
image = "./container/Dockerfile"
instance_type = "standard-1"
max_instances = 3

# Migration block — adds the DO class. Forward-only; use
# `new_classes` (KV-backed DO storage) per spec §4.8 — v1 access is
# point-lookup; SQLite buys nothing.
[[migrations]]
tag = "arc-190-v1"
new_classes = ["PrReviewRunDO"]

# SIG-138: RepoGraphDO uses SQLite storage (new_sqlite_classes).
# Sequential migration tag after arc-190-v1.
[[migrations]]
tag = "sig-138-v1"
new_sqlite_classes = ["RepoGraphDO"]

# SIG-119: ValidationMetricsDO uses SQLite storage. Forward-only; reverting
