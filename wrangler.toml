# (bake the store). "on" = inject learned per-repo guidance into specialist + synth
# prompts. Parsed by resolveLearningsMode (@/features/learnings).
SIGILIX_LEARNINGS_MODE = "on"

# Capture master switch (write-side). "on" lets capture run for repos that ALSO opt in
# via their sigilix.json (reviewMemory.enabled | captureOnly) — per-repo opt-in is the SOC2
# control. Enables the SIG-104 inline-reply Learnings auto-capture (the no-command
# "natural conversation" core; the learning is gated additionally by SIGILIX_LEARNINGS_MODE)
# AND the review-memory dismissal-signal corpus. Behaviorally write-only: retrieval/soften is
# SEPARATELY gated by OPENCLAW_REVIEW_MEMORY_ENABLED (unset = off), so nothing softens yet.
SIGILIX_REVIEW_MEMORY_CAPTURE = "on"

# SIG-439: incremental PR re-review. "on" => a re-review only looks at files that
# CHANGED (blob-sha differs) or were NEVER reviewed yet; files already reviewed at
# an unchanged blob-sha are skipped. Kills the per-commit finding "dribble" (the
# old per-pass shifting sample). Recall-safe by construction: a file is skipped
# only when byte-identical to its last review, and any plan error fails open to a
# full review. Code default is off; ON in prod per founder (2026-06-15 — the
# dribble is the top product-trust problem). "shadow" measures coverage without
# filtering.
SIGILIX_INCREMENTAL_REVIEW_MODE = "on"

# SIG-452: adversarial-framing hardening. "off" (default, DARK) = the "removed
# guarding test for a CHANGED symbol" signal is not computed, no prompt block,
# no extra IO → byte-identical to today. "shadow" = compute the signal + log
# counts by correlation strength ONLY (output byte-identical; no would-flag —
# that needs an extra model call, out of v1 scope). "enforce" = also fetch GitHub
# file metadata (rename exclusion), build the SYMBOL-grade signal, and inject the
# inverted-inference blocks into the logic specialist + synth user messages so a
# behavioral change whose guarding test was removed in the same PR RAISES
# suspicion (benchmark #29 A2/A4) instead of being waved through as intentional.
# Parsed by parseAdversarialFramingMode (@/lib/removed-guarding-tests).
# ENFORCE (founder directive 2026-06-16): live now. Recall-safe (only ADDS a "confirm
# intentional" finding; never drops). Residual FP risk = a generic exported symbol (e.g.
# `data`) coincidentally matched in a deleted assertion — soft (a question, not a P0/P1
# blocker), bounded by the per-PR cap (8). Watch /metrics/fp-rate; revert to "shadow" if it
# spikes. The K>=12 live FP eval + production-seam byte-identity test remain follow-ups (SIG-452).
SIGILIX_ADVERSARIAL_FRAMING_MODE = "enforce"

# SIG-436: deterministic inline anchor-precision pass. "on" re-homes an inline
# finding off a comment/blank/structural/header line onto the substantive code
# line it describes within the diff (lands the comment ON the bug, not the `//`
# above it). Eval (5 archetypes, K=12): reproduced comment-above-bug 0%→100%,
# aggregate exact-line 40%→80%, wrong-line (hallucination-equiv) rate DROPS
# (recall-safe). Only re-homes to a real changed RIGHT line; no confident target
# → unchanged. Code default is off (parseEnsembleConfig).
SIGILIX_ANCHOR_PRECISION = "on"

# SIG-228 Phase 3c — synth-bypass single-specialist hot path. When "on",
# the orchestrator skips the synthesizer LLM round-trip entirely when
# the dispatcher returns exactly 1 specialist AND none of that
# specialist's findings have `score >= 4` (major/critical). The
# specialist's verdict becomes the submission directly. Saves ~15-25s
# on the hot path (the typical `gpt-oss:120b-cloud` synth elapsed
# window).
#
# Bypass eligibility ladder (helper: `isSynthBypassEligible`):
#   1. This flag === "on"
#   2. `SHADOW_BAKEOFF_ROLES` does NOT include "synth" (so the
#      bake-off signal on the bypass-eligible cohort isn't halved)
#   3. Dispatcher narrowed to exactly 1 specialist on purpose
#   4. Exactly 1 specialist verdict came back non-null
#   5. No finding has `score >= 4`
#
# Safe by construction: no cross-specialist consensus to compute on the
# 1-role path, and the score-gate keeps anything major routed through
# the full synth pipeline so synth-level severity rewriting still fires
# when it matters. Rollback: flip to "off" or remove this line — no
# schema change, no migration. Default-off in dev/test (the env var
# is unset there).
SIGILIX_SYNTH_BYPASS_ENABLED = "on"
# SIG-393 — region re-sweep (dense-PR recall lever). Three-state rollout:
#   "off"     — phase is inert: no gate evaluation, no model calls, no
#               telemetry; specialist verdicts pass through by reference
#               (the pinned zero-change default in code).
#   "shadow"  — the deterministic effort gate + the scoped per-region
#               second pass RUN on qualifying PRs and emit
#               `resweep-gate-decision` / `resweep-shadow-summary`
#               telemetry, but candidates are NEVER merged — zero
#               posted-output change. Costs ~90-170s of the ~895s orch
#               wall when the gate fires (dense/high-risk PRs only;
#               small PRs structurally cannot fire). SHIPPING IN THIS
#               STATE FIRST to measure gate fire-rate + post-gate
#               candidate survival before enforcement.
#   "on"      — re-sweep candidates merge into the role verdicts
#               pre-synth (pass-1 finding ids unchanged) and flow
#               through the UNCHANGED validation/grounding/verification
#               gates — no gate bypass, no new posting surface.
#
# Rollout: shadow soak → promotion to "on" gated on the frozen-fixture
# clone delta (`evals score --pr --baseline`), post-gate high-sev FP
# flat, default-lane p50 unmoved. Rollback = flip back to "shadow"
# (telemetry only) or "off" (inert); both are safe one-line changes.
SIGILIX_RESWEEP_MODE = "shadow"
# SIG-395 — invariant lens (cross-cutting recall lever). Three-state rollout:
#   "off"     — phase is inert: no dispatch evaluation, no model calls, no
#               telemetry; verdicts pass through by reference (the pinned
#               zero-change default in code).
#   "shadow"  — the breadth gate + per-family preconditions decide which
#               single-charge auditors to dispatch; dispatched auditors RUN
#               (concurrent with the specialist fan-out — ~zero added
#               wall-clock) and emit `invariant-lens-decision` /
#               `invariant-lens-shadow-summary`, but candidates are NEVER
#               merged — zero posted-output change. SHIPPING IN THIS STATE
#               FIRST to measure family fire-rates + post-gate candidate
#               survival on organic traffic before enforcement.
#   "on"      — kept candidates (anchored-to-diff guard) merge into the
#               protected logic verdict pre-synth and flow through the
#               UNCHANGED validation/grounding/verification gates — no
#               gate bypass, no new posting surface.
#
# Rollout (REVISED 2026-06-11, SIG-392 floored K=12 measurement): the JOINT
# promotion is SPLIT — the two levers have opposite FP profiles at the prod
# seam. Lens union: floored 13/20 recall @ hi-sev FP 4.1-5 (within the ≤6.5
# bar) on the gemma4:31b synth, K=12 grade. Re-sweep union: FP 15-18 restored
# by the SIG-351 source floor (model-independent) → SIG-393 stays "shadow"
# until source-level FP discipline lands. LENS-FIRST flip to "on" here; note
# shadow already RUNS all lens calls (merge-only difference), so this flip
# adds zero call volume / zero wall-clock. Promotion probe: fresh fixture
# clone via `evals score --pr --baseline` + hi-sev FP within bar + p50
# unmoved. Rollback = flip back to "shadow" (telemetry only) or "off"
# (inert); both are safe one-line changes.
SIGILIX_INVARIANT_LENS_MODE = "on"
# SIG-369(b): route the SECOND-PASS logic re-runs (invariant-lens + resweep) to a
# cheaper strong reasoner (deepseek/deepseek-v4-pro) instead of the primary logic
# model — these passes are the dominant logic-input cost on dense PRs (~142K of
# #574's 172.8K). Still a win post-SIG-450 (v4-pro is cheaper than Kimi K2.7 too).
# "on" swaps ONLY the second-pass model; the primary logic specialist is unaffected.
# Recall gauge = the live Sigilix review of a real substantive PR (#440) — keep on
# if recall holds, else flip back to "off" (one-line, inert). Code default off.
SIGILIX_SECONDPASS_REASONER_MODE = "on"
# SIG-392 — recall-eliciting LOGIC prompt (#508). "on" appends the recall
# directive to the logic specialist's system prompt. Per-PR logic bake-off
# (dense fixture, K=6, citation-judged): default prompt 6.0/20 logic recall →
# this prompt ~16/20, catching the frontier rows (b5/b10/b19/b20) the default
# was blind to — SAME model (deepseek-v4-pro), no migration. It trades
# specialist-stage precision for recall (the two are coupled at the prompt
# level); the downstream gates are the precision backstop, and the SIG-392
# class-collapse gate (#510) absorbs the same-class redundancy it produces (0/4
# fixture traps flagged, 0 hallucinations in audit). FLIPPING TO "on" for the
# full-pipeline validation probe: measure posted recall vs posted hi-sev FP on
# a fresh dense-fixture clone (`evals score --pr --baseline`) + p50 unmoved.
# Rollback = flip to "off" (inert, byte-identical to the default prompt) — a
# safe one-line change.
SIGILIX_LOGIC_RECALL_MODE = "on"

# ── SIG-406 OpenRouter ALPHA lineup tunings ─────────────────────────────────
# The deployed alpha runs the SIG-399-tuned lineup on OpenRouter (see
# ENGINEERING.md §"The model lineup" + src/lib/ensemble/adapters/model-provider.ts).
# These [vars] turn ON the per-role reasoning + recall/reasoning prompt suffixes the
# tuning sweep validated; the code defaults stay OFF so local runs + the test suite
# stay byte-identical without them. (SIGILIX_LOGIC_RECALL_MODE above is part of this
# lineup.)
#   - reasoning EFFORT (SIG-287 harness): logic at HIGH, tests at medium. SIG-450 added
#     the per-role `role:level` token so logic (Kimi K2.7, screened at high) can run a
#     different effort than tests (v4-pro, validated at medium) under one global LEVEL.
#     A bare role uses LEVEL; the map is built only when MODE === "on".
#   - SECURITY recall suffix: names the authz-resolution classes (flash reasoning OFF
#     — it collapses flash; the suffix carries the lift instead).
#   - LOGIC reasoning-PROMPT suffix (SIG-399): enumerate-then-judge / verify-the-value
#     (validated on o3; carried forward to the Kimi logic specialist, SIG-450).
SIGILIX_REASONING_MODE = "on"
SIGILIX_REASONING_ROLES = "logic:high,tests"
SIGILIX_REASONING_LEVEL = "medium"
SIGILIX_SECURITY_RECALL_MODE = "on"
SIGILIX_LOGIC_REASONING_PROMPT_MODE = "on"

# SIG-235 — min-specialists early exit. Three-state rollout:
#   "off"     — fan-out waits for ALL dispatched specialists to settle.
#   "shadow"  — fan-out STILL waits for all, but emits
#               `ensemble-min-specialists-early-exit-would-fire`
#               telemetry the moment N-1 of N specialists return. Used
#               to size the win + validate the cancel pattern without
#               actually changing fan-out semantics. SHIPPING IN THIS
#               STATE FIRST so we have a validation window before
#               enforcing.
#   "on"      — cancels laggard role(s) via per-role AbortController
#               and proceeds to synth as soon as N-1 of N succeed.
#               Synth runs on the partial input with the existing
#               [DEGRADED COVERAGE] block. Late verdicts from the
#               cancelled role are logged (`ensemble-late-verdict-
#               discarded`) but discarded — the synth has already run.
#
# Rollout plan: ship "shadow" → bake 1-2 days / 50+ reviews → flip "on"
# in a follow-up one-line PR. Rollback = flip back to "off"; per-role
# AbortControllers are added in either mode, but the cancel logic only
# fires on "on", so flipping back is safe.
SIGILIX_MIN_SPECIALISTS_EARLY_EXIT = "shadow"

# SIG-236 — surgical prompt-budget telemetry for the logic specialist.
# Three-state rollout:
#   "off"     — no telemetry, no truncation (default).
#   "shadow"  — measure the constructed logic prompt's per-section size
#               + emit `logic-prompt-budget` telemetry; the prompt
#               passes through untouched. Used to size the enforce-mode
#               cuts before flipping. SHIPPING IN THIS STATE FIRST so
#               we have ~24-48h / 30+ logic-dispatched PRs of data
#               before designing the actual cuts.
#   "enforce" — NOT YET IMPLEMENTED. Currently behaves like shadow but
#               records `mode: "enforce-pending"` in the event so a
#               premature flip is observable. The actual truncation
#               + per-role schema with `findings.maxItems: 3-4` lands
#               in a follow-up PR informed by shadow data.
#
# Codex-recommended target cap: 6_000 input tokens (vs current
# unbounded). Logic's prompt is empirically uniquely-expensive — same
# 60s timeout on two different model families on PR #188 — and trimming
# graph context + symbol retrieval + Vectorize retrieval should let
# models actually return a verdict.
# SIG-287: ENFORCE (was "shadow") — the logic specialist was timing out on
# ~every review (prompt-bound 60s), so reviews ran degraded and the bot
# fake-approved. Enforcing the ≤6K budget lets logic actually return a verdict.
SIGILIX_LOGIC_PROMPT_BUDGET = "enforce"

# SIG-369(b): measure WHERE the logic specialist's model input goes (~140K input
# tokens on a ~13K diff) so the follow-up can cut the biggest low-recall-value
# block safely. "shadow" = TELEMETRY-ONLY (no extra model calls, zero cost):
# emits `logic-input-composition` + attaches `logicInputComposition` to the
# review-telemetry record. "off" reverts (default-off in code).
SIGILIX_LOGIC_INPUT_COMPOSITION = "shadow"

# SIG-161 confidence-threshold verdict gate. Three-state rollout:
#   "off"     — gate bypassed; verdict is the legacy `findings.length > 0`.
#               Identical behavior to pre-SIG-161. This is the PR 4a default.
#   "shadow"  — gate runs but ships the legacy verdict; the new verdict is
#               logged to ValidationMetricsDO for divergence analysis.
#               Flips in PR 4b.
#   "enforce" — gate ships its verdict (REQUEST_CHANGES / COMMENT / APPROVE).
#               Flips in PR 4c after stage-1 calibration is committed.
#
# The threshold + model artifact live in KV (NOT here) so a calibration
# retune is a `wrangler kv:key put` not a redeploy. See DESIGN.md §9.
#   KV key  config:gate-threshold:v1   number  (default 1.0 = never block)
#   KV key  config:gate-model:v1       JSON    (logistic-regression coefs;
#                                               default null = use hand-blend)
# Cache TTL 60s in the Worker so updates take effect on the next request.
SIGILIX_GATE = "shadow"

# SIG-196: Sigilix Slack agent mode. "off" (default) | "shadow" | "on".
# Secrets (SLACK_SIGNING_SECRET, SLACK_CLIENT_ID, SLACK_CLIENT_SECRET,
# SLACK_BOT_TOKEN) go through `wrangler secret put`; they are never in [vars].
# The hosted-MCP static-OAuth secret SIGILIX_SLACK_CLIENT_SECRET is likewise set
# via `wrangler secret put` (its public id SIGILIX_SLACK_CLIENT_ID is in [vars]).
SIGILIX_SLACK_MODE = "on"
# Beta channel→repo scope (key "<teamId>:<channelId>"; repos must be EXACT
# owner/repo entries in OPENCLAW_GITHUB_INSTALLATION_MAP). FALLBACK ONLY:
# customer channel→repo bindings live in D1 (migration 0019, portal-managed)
# and are resolved FIRST — this env map keeps the founder's beta channel safe.
SIGILIX_SLACK_SCOPE_MAP = '{"T0AFVBGRDRD:C0BEL8ZAARE":{"repos":["sigilix/sigilix"]}}'

# SIG-545 B1: enable the agent-runner. "on" → dispatchAgentRun mints a GitHub App
# installation token and hands the task to the AgentRunnerContainer. The only caller
# today is the admin-gated POST /admin/agent-run (bearer OPENCLAW_ADMIN_TOKEN); no
# automatic trigger exists until B3 (Linear-assignee). Flip back to dark to kill.
SIGILIX_AGENT_RUNNER_MODE = "on"

# sig-portal-agent: the SEPARATE portal gate for POST /v1/agent/runs (in-portal
# Make-a-PR). Default-off keeps the already-live global runner private; "on" lets
# the portal's session-authed, tenant-scoped (userControlsRepo) coding agent
# dispatch REAL runs (clone → edit → PR) instead of the honest "preview" state.
SIGILIX_PORTAL_AGENT_RUNNER_MODE = "on"

# Live diff-pane streaming: the Worker's OWN public base. When set, dispatch mints
# a per-run secret + tells the runner container to POST each file-edit diff to
# {this}/internal/agent-runs/:runId/events (machine-authed). Unset → no streaming
# (the portal diff pane falls back to the finished PR diff). Revertible: remove
# this line to instantly turn streaming off.
SIGILIX_AGENT_EVENTS_ENDPOINT = "https://api.sigilix.ai"

# SIG-566: the Worker's own public base. The container receives only a
# short-lived opaque capability for this machine MCP endpoint; provider OAuth
# credentials remain in the Worker-owned vault.
SIGILIX_AGENT_MCP_ENDPOINT = "https://api.sigilix.ai"

# SIG-545 B2: the Worker's OWN public base for the container's sigilix-grounding
# plugin (calls {this}/v1/context + /v1/memory). Bearer = OPENCLAW_SIGILIX_API_KEY
# (already a set secret). Unset → the full agent runs BLIND (never grounds); set →
# the runner's full CLI agent grounds on the hybrid retrieval path (SIG-133) and
# multi-hops via retrieve_codebase/read_file_lines. Revertible: remove this line.
OPENCLAW_AGENT_GROUNDING_ENDPOINT = "https://api.sigilix.ai"

# Public origin used to build the Linear OAuth redirect_uri. MUST be the same
# site as the portal (app.sigilix.ai) so the callback carries the portal session
# cookie — a workers.dev redirect drops the .sigilix.ai cookie and the callback
# fails requireSession ("must be completed by the user who started it"). This is
# deliberately NOT OPENCLAW_GATEWAY_ISSUER (that is the GCP WIF `iss`, a
# workers.dev origin). This exact value MUST also be an allowed redirect URI on
# the Linear OAuth app.
SIGILIX_LINEAR_REDIRECT_ORIGIN = "https://api.sigilix.ai"

# Consumer binding — DEFERRED out of wrangler.toml because Cloudflare's
# Queue API rejects re-registering a consumer that's already bound to
# this same script (HTTP 11004 — "Queue already has a consumer"), and
# the CF Workers Builds CI re-runs `wrangler deploy` on every push. The
# initial registration was done once via `wrangler deploy` from a local
# checkout after the openclaw-worker → sigilix cutover; subsequent
# deploys must not try to re-register, or CI fails.
#
# The consumer is still active — bound at the dashboard / queue level,
# not at deploy time. `src/index.ts` still exports a `queue()` handler
# that processes openclaw-jobs messages.
#
# To rebind manually if it ever comes loose:
#   npx wrangler queues consumer add openclaw-jobs sigilix \
#     --batch-size 1 --max-concurrency 5 --max-retries 3 --batch-timeout 1
# Or via dashboard: Workers & Pages → openclaw-jobs (queue) → Settings
# → Consumers → Add consumer → pick `sigilix`.
#
# [[queues.consumers]]
# queue = "openclaw-jobs"
# max_batch_size = 1
# max_concurrency = 5
# max_retries = 3
# max_batch_timeout = 1

# Required secrets (set via `wrangler secret put`):
#
#   LINEAR_API_KEY                Personal API key — used as the manual-trigger
#                                 route's bearer secret AND as the Linear API
#                                 fallback when OAuth isn't configured.
#                                 Linear → Settings → API → Personal API keys
#   LINEAR_WEBHOOK_SECRET         Signing secret from the Linear webhook config.
#                                 Used to verify the HMAC on every webhook delivery.
#   OPENROUTER_API_KEY            OpenRouter API key (https://openrouter.ai/keys). REQUIRED —
#                                 SIG-406 alpha runs the ENTIRE review ensemble (specialists +
#                                 synthesizer + dispatcher) on OpenRouter, so review FAILS CLOSED
#                                 without it (each call returns missing_api_key). Per-call key
#                                 selection is by model-id shape (slash-id → this key).
#   OLLAMA_API_KEY                Ollama Turbo API key (https://ollama.com/settings/keys). Now
#                                 OPTIONAL/LEGACY — serves the non-review command paths
#                                 (/api/chat, @-mention agent loop, indexer) and local eval
#                                 testing (a `:cloud` model override routes here, no OpenRouter
#                                 spend). Not needed for the review path.
#
# Optional (recommended for production — gives the Worker its own bot identity):
#
#   LINEAR_OAUTH_CLIENT_ID        OAuth app client_id from Linear → Settings →
#   LINEAR_OAUTH_CLIENT_SECRET    API → OAuth applications. Together they let
#                                 the Worker mint a 30-day app-actor token via
#                                 client_credentials. Comments and field
#                                 updates then appear as the OAuth app rather
#                                 than the human owner of LINEAR_API_KEY.
#
# Required for the GitHub webhook routes (PR overview, CI triage, CR eval,
# proactive PR review). Without these the /github/webhook route returns 503
# — we never want to fall back to a developer's PAT for PR-side actions.
#
#   GITHUB_APP_ID                 Numeric App ID from
#                                 https://github.com/organizations/Arc-and-Anchor/settings/apps/<app-name>
#   GITHUB_PRIVATE_KEY            PEM-encoded RSA private key (PKCS#1 or PKCS#8).
#                                 GitHub's "Generate a private key" button
#                                 downloads PKCS#1 — paste it as-is.
#   GITHUB_WEBHOOK_SECRET         HMAC secret on the App's webhook config.
#                                 Used to verify X-Hub-Signature-256 on every
#                                 inbound delivery.
#
# Required GitHub App permissions:
#   Repository → Actions: Read       (CI logs)
#   Repository → Checks: Write       (ARC-258 in-progress reviewer check)
#   Repository → Contents: Read      (file contents at a given ref)
#   Repository → Issues: Write       (top-level PR comments)
#   Repository → Pull requests: R/W  (PR diff, review comments, submit review)
#   Repository → Metadata: Read      (default)
#
# Required GitHub App webhook events:
#   installation                  (initial indexing + uninstall cleanup)
#   installation_repositories     (repos added/removed indexing + cleanup)
#   pull_request                  (opened, synchronize, ready_for_review, reopened)
#   push                          (default/dev/active-PR branch re-indexing)
#   workflow_run                  (CI failure triage)
#   issue_comment                 (top-level PR conversation @-mentions + explicit feedback capture)
#   pull_request_review           (formal review-dismissal feedback capture)
#   pull_request_review_comment   (inline PR review comment @-mentions)
#
# Optional (other):
#   OPENCLAW_MODEL                Override the default model (defaults to glm-5.1:cloud)
#   OPENCLAW_TEAM_KEY             Linear team key to scope to (e.g. "ARC")
#   OPENCLAW_VALIDATION_METRICS_TOKEN
#                                 SIG-119 — shared-secret bearer token guarding
#                                 GET /metrics/validation (validator shadow
#                                 telemetry). If UNSET the endpoint returns 503
#                                 (disabled); a missing/wrong bearer returns 401.
#                                 Set via `wrangler secret put`.
#
# Optional (Phase 5 user-OAuth — required only for /auth/* routes; if
# unset, /auth/github + /auth/github/callback return 503 and the rest
# of the Worker is unaffected). See `.claude/handoff/arc-phase5-auth-spec-v2-LOCKED.md`.
#
#   GITHUB_OAUTH_CLIENT_ID        OAuth client_id from the same GitHub App as
#   GITHUB_OAUTH_CLIENT_SECRET    GITHUB_APP_ID. The App settings page exposes
#                                 both server-to-server (JWT, used for repo
#                                 access) AND user-to-server (OAuth, used to
#                                 sign humans into the app.sigilix.ai dashboard).
#   OPENCLAW_SESSION_ENCRYPTION_KEY  32 random bytes, base64url-encoded. Used to
#                                 AES-GCM-encrypt user access tokens at rest in
#                                 OPENCLAW_STATE. Generate with:
#                                 openssl rand 32 | basenc --base64url -w0
#                                 Rotating this invalidates every active session.
#   OPENCLAW_BASE_URL             Public origin for OAuth callbacks (must match
#                                 the GitHub App's configured callback URL).
#                                 Defaults to https://app.sigilix.ai when unset.
#
# Optional (#155 onboarding-backend slice 3 — portal endpoints). The portal
# (Next.js, app.sigilix.ai prod / localhost:3300 dev) is a DIFFERENT ORIGIN
# from this Worker and drives the session-based onboarding flow over
# `fetch(..., { credentials: "include" })`:
#
#   OPENCLAW_PORTAL_ORIGINS       Comma-separated EXACT origins allowed to make
#                                 credentialed cross-origin requests against the
#                                 onboarding + key routes (CORS-with-credentials —
#                                 see src/lib/portal-cors.ts). Defaults to
#                                 "https://app.sigilix.ai,http://localhost:3300"
#                                 when unset.
#   OPENCLAW_PORTAL_URL           When set, gates two redirect changes (unset =
#                                 today's behavior, byte-identical): the OAuth
#                                 login callback's default success destination
#                                 becomes `${OPENCLAW_PORTAL_URL}/setup` instead
#                                 of /auth/welcome, and GET /setup 302s to
#                                 `${OPENCLAW_PORTAL_URL}/setup?installed=1&installation_id=N`
#                                 instead of rendering the plaintext-key page
#                                 (the portal mints its own key via POST
#                                 /v1/keys). N is a non-secret selector only;
#                                 every Portal API call re-authorizes that exact
#                                 installation. e.g. https://app.sigilix.ai
#
# GitHub App callback URL (required for OAuth): set on the App settings page →
# Identifying and authorizing users → User authorization callback URL:
#   https://app.sigilix.ai/auth/github/callback

# SIG-156 PR3: index reconciliation cron. Every 6h, walk all installations
# + their repos and enqueue an index-repo job for any repo missing a
# manifest in KV. Self-heals dropped install / repos-added webhooks (the
# gap that left every install dark before PR2's backfill). Idempotent and
# cheap to run more often if needed — the cost is one KV read per repo
# + one queue send per missing repo.
[triggers]
crons = ["0 */6 * * *"]

# Workers Logs subsection — pairs with the top-level [observability]
# block at the top of this file. `enabled = true` opts log events
# into the searchable Workers Logs dataset (7-day retention).
# `invocation_logs = true` adds a synthetic per-invocation request
# line so webhook deliveries are visible even when triage emits
# nothing — invaluable for "did the webhook even arrive?" debugging.
# Required for the monitoring-app initiative: the sigilix-trace-
# events-r2 Logpush job subscribes to the same upstream Trace Events
# stream that the parent [observability] block enables.
