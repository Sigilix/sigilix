# Worker name — drives the deploy URL (e.g.
# `sigilix.<account>.workers.dev`) and is what GitHub / Linear webhook
# configs point at. Renamed from `openclaw-worker` during the Sigilix
# rebrand. KV/Queue/Vectorize binding NAMES still use the legacy
# `OPENCLAW_*` prefix (deferred to a follow-up to avoid churning ~100
# `env.OPENCLAW_*` references in code in the same PR — bindings are
# internal, not user-visible, so the visible-surface rebrand can ship
# first).
name = "sigilix"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# Workers Trace Events Logpush opt-in — required for the
# sigilix-trace-events-r2 Logpush job (R2 bucket: sigilix-telemetry)
# to receive any data. Without this, the Worker emits zero records
# to the workers_trace_events dataset and the Logpush job pushes
# empty batches. Independent from the [observability] block below:
# both subscribe to the same upstream Trace Events stream but are
# billed separately (Logpush is a paid add-on; Workers Logs is
# included in Workers Paid).
logpush = true

# Workers Logs — in-dashboard searchable log viewer with 7-day
# retention. Mirror of the dashboard Observability toggle; wrangler
# is the source of truth at deploy time, so toggling in the dashboard
# alone would be reverted on next `wrangler deploy`.
[observability]
enabled = true
head_sampling_rate = 1

# Standard usage model — Bundled gives ctx.waitUntil() only ~30s of
# wall-clock budget after the response, which Ollama Turbo blows past
# routinely (its calls take 30-90s for a description rewrite). On
# Standard we get up to 30 min of waitUntil time and an explicit CPU
# budget in milliseconds, which is what the triage path needs.
#
# The legacy `usage_model = "unbound"` directive was removed in
# wrangler 4 and is silently ignored — the Worker was actually
# running on the Bundled default, which was killing waitUntil mid-
# triage and leaving every test issue with no comment / no rewrite.
[limits]
cpu_ms = 300000

# KV namespace for dedupe state.
# Stores marker comment IDs by issue identifier so re-firing
# webhooks edit-in-place instead of duplicating triage comments.
# Replaces the file-on-disk poll-state.json the Node daemon used.
#
# Run once: `wrangler kv:namespace create OPENCLAW_STATE`
# Then paste the returned ID below.
[[kv_namespaces]]
binding = "OPENCLAW_STATE"
id = "df689379ea6240f7808997a75ceaed7e"

# Vectorize index for codebase chunks. Embeddings are 768-dim vectors
# from Cloudflare's @cf/baai/bge-base-en-v1.5, indexed under one
# namespace per repo (e.g. "rubberfit", "rubberfit-desktop") so
# triage on a Linear issue can scope retrieval to the relevant repo.
#
# Run once: `wrangler vectorize create openclaw-code-index \
#   --dimensions=768 --metric=cosine`
# Then populate via scripts/index-repo.mjs (see README).
[[vectorize]]
binding = "OPENCLAW_CODE_INDEX"
index_name = "openclaw-code-index"

# Cloudflare Workers AI binding — used for embedding the issue/comment
# body at query time. Keeps the embedding model identical between
# index time (CLI/CI script also calls @cf/baai/bge-base-en-v1.5 via
# the REST API) and retrieval time, which is critical for cosine sim
# to be meaningful.
[ai]
binding = "AI"

# Cloudflare Queue — `ctx.waitUntil()` has a hard 30s cap that's not
# configurable on any plan, and Ollama Turbo calls (Kimi/GLM) routinely
# take 30-90s. Webhooks now enqueue a JobMessage and return 200 fast
# (~50ms); the queue consumer below processes the job with up to 15
# minutes of wall-clock time per Cloudflare's documented limits.
#
# Run once before first deploy:
#   npx wrangler queues create openclaw-jobs
#
# Producer binding — the fetch handler `.send()`s here.
[[queues.producers]]
binding = "OPENCLAW_JOBS"
queue = "openclaw-jobs"

# ARC-190: Durable Object for per-PR review-run state. Spec at
# docs/superpowers/specs/2026-05-07-arc-190-durable-objects-webhook-ingest-design.md.
# DO orchestrates dedupe + retry + watchdog for `pr-review` work; the
# existing OPENCLAW_JOBS queue still executes the actual review (DOs
# are time- and memory-capped, ensemble runs are 60-180s).
[[durable_objects.bindings]]
name = "PR_REVIEW_RUN"
class_name = "PrReviewRunDO"

# SIG-138: per-repo code/dependency graph stored in SQLite DO storage.
# Keyed by `indexNamespace(owner, repo)` (one DO instance per repo).
# Flag-gated behind OPENCLAW_GRAPH_INDEX / OPENCLAW_GRAPH_RETRIEVAL.
[[durable_objects.bindings]]
name = "REPO_GRAPH_DO"
class_name = "RepoGraphDO"

# SIG-119: single global DO holding rolling per-gate validator shadow
# telemetry (would-drop / kept daily buckets, 35-day retention). One
# instance (idFromName("global")); read via the authenticated
# GET /metrics/validation endpoint guarded by
# OPENCLAW_VALIDATION_METRICS_TOKEN.
[[durable_objects.bindings]]
name = "VALIDATION_METRICS_DO"
class_name = "ValidationMetricsDO"

# SIG-152: single global DO holding rolling daily aggregates of the SIG-138
# `pr-review-graph-retrieval` shadow sample (avg jaccard / added-context /
# blast counts, 35-day retention). Read via GET /metrics/graph (same
# OPENCLAW_VALIDATION_METRICS_TOKEN bearer).
[[durable_objects.bindings]]
name = "GRAPH_METRICS_DO"
class_name = "GraphMetricsDO"

# SIG-184: per-repo-sharded DO enforcing single-use of a runner-evidence receipt
# (repository_id, sha, run_id, run_attempt) + holding the defensible record
# (SQLite). Sharded by repository_id (idFromName). Not exercised until the
# OPENCLAW_RUNNER_* config is set.
[[durable_objects.bindings]]
name = "RUNNER_RECEIPT_DO"
class_name = "RunnerReceiptDO"

# SIG-184 PR 5b: single global DO holding rolling runner-evidence presence
# counters (state × evidence-pending-reason daily buckets + per-repo latest
# state, 35-day retention). Read via GET /metrics/runner-evidence (same
# OPENCLAW_VALIDATION_METRICS_TOKEN bearer as the other /metrics/* endpoints).
[[durable_objects.bindings]]
name = "RUNNER_EVIDENCE_METRICS_DO"
class_name = "RunnerEvidenceMetricsDO"

# SIG-285 PR 2: single global DO holding rolling verification-by-execution
# verdict counters (confirmed/refuted/inconclusive/no-check × category daily
# buckets, 35-day retention). Read via GET /metrics/verification (same
# OPENCLAW_VALIDATION_METRICS_TOKEN bearer).
[[durable_objects.bindings]]
name = "VERIFICATION_METRICS_DO"
class_name = "VerificationMetricsDO"

# SIG-286 PR2.5: single global DO holding rolling graph-context-expansion shadow
# aggregates (netNewTokens histogram → median, cross-file rates, fetch cost,
# 35-day retention). Read via GET /metrics/graph-expansion (same
# OPENCLAW_VALIDATION_METRICS_TOKEN bearer). Telemetry-only — nothing here
# changes a posted review.
[[durable_objects.bindings]]
name = "GRAPH_EXPANSION_METRICS_DO"
class_name = "GraphExpansionMetricsDO"

# Migration block — adds the DO class. Forward-only; use
# `new_classes` (KV-backed DO storage) per spec §4.8 — v1 access is
# point-lookup; SQLite buys nothing.
[[migrations]]
tag = "arc-190-v1"
new_classes = ["PrReviewRunDO"]

# SIG-138: RepoGraphDO uses SQLite storage (new_sqlite_classes).
# Sequential migration tag after arc-190-v1.
[[migrations]]
tag = "sig-138-v1"
new_sqlite_classes = ["RepoGraphDO"]

# SIG-119: ValidationMetricsDO uses SQLite storage. Forward-only; reverting
# this PR is safe (no data written until the endpoint is exercised).
[[migrations]]
tag = "sig-119-v1"
new_sqlite_classes = ["ValidationMetricsDO"]

# SIG-152: GraphMetricsDO uses SQLite storage. Forward-only.
[[migrations]]
tag = "sig-152-v1"
new_sqlite_classes = ["GraphMetricsDO"]

# SIG-184: RunnerReceiptDO uses SQLite storage. Forward-only; reverting is safe
# (no data is written until the runner-ingest route is exercised, which needs the
# OPENCLAW_RUNNER_* config set first).
[[migrations]]
tag = "sig-184-v1"
new_sqlite_classes = ["RunnerReceiptDO"]

# SIG-184 PR 5b: RunnerEvidenceMetricsDO uses SQLite storage. Forward-only;
# reverting is safe (telemetry-only — no review behavior depends on it).
[[migrations]]
tag = "sig-184-metrics-v1"
new_sqlite_classes = ["RunnerEvidenceMetricsDO"]

# SIG-285 PR 2: VerificationMetricsDO uses SQLite storage. Forward-only;
# reverting is safe (telemetry-only — no review behavior depends on it).
[[migrations]]
tag = "sig-285-metrics-v1"
new_sqlite_classes = ["VerificationMetricsDO"]

# SIG-286 PR2.5: GraphExpansionMetricsDO uses SQLite storage. Forward-only;
# reverting is safe (telemetry-only — no review behavior depends on it).
[[migrations]]
tag = "sig-286-metrics-v1"
new_sqlite_classes = ["GraphExpansionMetricsDO"]

# ARC-190 env-var documentation (set via `wrangler secret put` or
# wrangler.toml [vars]):
#   OPENCLAW_PR_REVIEW_DO_MAX_RETRIES    # numeric; clamped [1, 10], default 3
#   OPENCLAW_PR_REVIEW_DO_WATCHDOG_MS    # numeric; clamped [60000, 1800000] ms, default 1200000 (20 min)
#   OPENCLAW_PR_REVIEW_DO_HISTORY_LIMIT  # numeric; clamped [1, 100], default 10
#
# SIG-184 runner-evidence ingest (POST /runner/ingest) — both UNSET for now; the
# route returns 503 until they're provided (values come from the Sigilix runner
# repo, PR 4). Non-secret → set in [vars] below or via the dashboard when ready:
#   OPENCLAW_RUNNER_OIDC_AUDIENCE        # the `aud` the runner mints its OIDC token with
#   OPENCLAW_RUNNER_WORKFLOW_REF         # pinned reusable-workflow `owner/repo/path` (no @ref)
# ARC-283 Phase B1b — shadow-mode model bake-off:
#   SHADOW_BAKEOFF_ROLES                 # CSV of "logic"|"security"|"performance"|"tests"|"synth"
#                                        # (default "" — shadow off everywhere). When set, the
#                                        # candidate lineup defined in lib/shadow-bakeoff-config.ts
#                                        # fires in parallel with prod on every PR review and emits
#                                        # `shadow-verdict-comparison` telemetry. Shadow output is
#                                        # NEVER posted to GitHub. Set via `wrangler secret put` for
#                                        # production, or the [vars] block below for local/preview.
#                                        # See docs/ops/shadow-bakeoff.md for rollout guidance.

# Plaintext env vars (non-secret). Secrets go through `wrangler secret
# put` instead — `[vars]` is for values that are safe to commit and
# need a default at deploy time.
[vars]
# SIG-234 (2026-05-26): bake-off DISABLED because production now runs
# the lineup that the bake-off was validating. The bake-off candidate
# config in `src/lib/shadow-bakeoff-config.ts` is preserved as a
# code-level record of Codex's ARC-292 analysis; flip back to a
# non-empty CSV ("synth", "synth,security,tests", etc.) to bake-off
# against the OLD lineup or a future candidate set. Empty string =
# bake-off off, no shadow telemetry, no extra LLM spend per review.
#
# Historical (pre-SIG-234): ARC-283 Phase B1b shipped on 2026-05-18
# with `synth` role enabled for bake-off, with `security,tests`,
# `performance`, `logic` queued. SIG-234 graduated the entire lineup
# directly (informed by format-compatibility curl-tests against
# Ollama Cloud); the bake-off no longer has a current target.
SHADOW_BAKEOFF_ROLES = ""

# SIG-138 code/dependency graph (Greptile-parity). Both default OFF.
#   OPENCLAW_GRAPH_INDEX     "off" | "shadow" | "on"  — graph WRITER in the
#                            indexer (extract + RepoGraphDO upsert/commit).
#   OPENCLAW_GRAPH_RETRIEVAL "off" | "shadow" | "post" — graph EXPANSION of
#                            vector hits in PR review (Phase 2).
# Shadow emits telemetry only; neither changes posted review output. Flip to
# "shadow" per phase after acceptance review, then "on"/"post" once the
# bake-off telemetry is reviewed.
# SIG-152 (2026-05-22): flipped to "shadow" to start live graph shadow
# validation. Both paths are additive — indexer writes the graph, PR review
# computes graph expansion + emits `pr-review-graph-retrieval`, but posted
# review output is unchanged in shadow. Read the telemetry via GET
# /metrics/graph.
#
# SIG-138 (2026-05-22): RETRIEVAL flipped to "post" after shadow acceptance —
# /metrics/graph showed real grounded context (nodeCount/addedCount/blast >0
# across multi-repo PR reviews once the SIG-156 backfill landed). In "post",
# the graph block now INJECTS context into the logic/tests/synth prompts (not
# just telemetry). The INDEX flag stays "shadow" (`graphIndexEnabled` treats
# "on" and "shadow" identically, so no behavior change there).
OPENCLAW_GRAPH_INDEX = "shadow"
OPENCLAW_GRAPH_RETRIEVAL = "post"

# SIG-286 graph-context body EXPANSION ("off" | "shadow" | "post"). Default OFF.
# shadow/post both COMPUTE the enriched changed-symbol context (definition /
# caller / import-dependent bodies) and emit the `graph-expansion-shadow`
# telemetry event; neither injects into any prompt in PR1 (post is RESERVED).
# SIG-286 (2026-05-30): flipped off → shadow to start measuring the cross-file
# fetch opportunity (bodiesSource.missing / dropped.sourceMissing / row counts)
# before wiring the bounded fetch in PR2. PR1 passes NO fetcher, so this is
# fast (DO query + slicing from astFilesByPath, no GitHub reads) — zero prompt
# injection, zero posted-behavior change.
OPENCLAW_GRAPH_EXPANSION = "shadow"

# SIG-184 runner-evidence ("defensible receipt") go-live (2026-05-30, founder-
# authorized). The first two un-503 the POST /runner/ingest route so the runner
# can deposit receipts; the third turns on consumption.
#   OPENCLAW_RUNNER_OIDC_AUDIENCE  — the `aud` the runner mints its OIDC token
#     with; the ingest route requires the token's `aud` to equal this. Stable
#     opaque id (domain-independent) so a future custom domain doesn't break
#     every caller workflow. The caller's `oidc-audience:` input MUST match.
#   OPENCLAW_RUNNER_WORKFLOW_REF   — Sigilix's pinned reusable workflow as
#     `owner/repo/path` (NO @ref). The token's `job_workflow_ref` path part must
#     equal this (owner/repo compared case-insensitively, path case-sensitively).
#   OPENCLAW_RUNNER_EVIDENCE_MODE  — "off" | "shadow" | "post". `post`: a verified
#     receipt's SARIF backs the review (rawOverride) + the check-run renders the
#     VERIFIED/PENDING trust pill. runner-absent (no receipt) is inert — every
#     repo without the Action reviews exactly as before. Rollback: set "off".
OPENCLAW_RUNNER_OIDC_AUDIENCE = "sigilix-runner-ingest"
OPENCLAW_RUNNER_WORKFLOW_REF = "Sigilix/runner/.github/workflows/scan.yml"
OPENCLAW_RUNNER_EVIDENCE_MODE = "post"

# SIG-285 verification-by-execution rollout posture (off | shadow | enforce):
#   - shadow: re-check (worker-native, line-anchored) that each score>=4
#     logic/security finding's cited token appears at the cited line; emit the
#     verdict (confirmed/refuted/inconclusive/no-check) telemetry. OBSERVE-ONLY.
#   - enforce (SIG-285 PR 4): same, PLUS demote a REFUTED inline finding (a
#     mis-anchored citation) from an inline comment to a PR-body row — never
#     drop; FN-cost >> FP-cost. The demote changes the SURFACE, not the gate: a
#     score>=4 body finding still forces REQUEST_CHANGES (SIG-281 body floor), so
#     a possibly-real refuted finding stays both visible AND blocking — it just
#     stops being a mis-anchored inline thread. Demote decisions are readable at
#     /metrics/validation (gate `verification-refuted`).
# Rollback: set "shadow" (telemetry, no demote) or "off".
OPENCLAW_VERIFICATION_MODE = "enforce"

# SIG-285 re-anchor (inline-first): when verification is `enforce`, set
# OPENCLAW_VERIFICATION_REANCHOR = "on" to APPLY the re-anchor MUTATION — a
# refuted (mis-anchored) inline finding with exactly one same-file added line
# holding ALL its cited tokens is MOVED to that line (a correct inline) instead
# of body-demoted (the body-demote handles the ambiguous/no-match remainder).
# Default (unset / not "on") = OFF — the re-anchor stays shadow-measured (PR1,
# /metrics/validation gate `verification-reanchor`). Rollback: comment out / set
# anything but "on".
OPENCLAW_VERIFICATION_REANCHOR = "on"

# SIG-285 v2 PR1: receipt-join verification — the NO-PERM sandbox foundation.
# "off" (default) | "shadow" | "enforce" (reserved). When ON + a VERIFIED SIG-184
# runner receipt exists, join each score>=4 security finding (with a resolvable
# evidenceId) to the receipt's UN-FILTERED HEAD SARIF: CONFIRMED if the same rule
# still fires at the cited path/line, INCONCLUSIVE otherwise — NEVER refuted
# (absence is over-determined; sound REFUTED is PR4). TELEMETRY ONLY
# (event:verification-receiptjoin); NO score/render/behavior change, NO new GitHub
# permission. PR1 lands INERT (off); PR2 flips to "shadow" to measure the
# refutable-eligible fraction. Rollback: set "off".
# SIG-285 v2 PR2 (2026-05-31): flipped off → shadow to START the measurement.
# Shadow runs the join + persists verdicts to VerificationMetricsDO under the
# `receiptjoin` category + emits telemetry — but NEVER changes the review (no
# demote/render). Read GET /metrics/verification → `receiptJoin
# .refutableEligibleFraction`: the load-bearing number deciding PR4/5 (demote)
# vs receipts-as-trust. Needs a VERIFIED runner receipt (dogfood has one).
OPENCLAW_RECEIPTJOIN_MODE = "shadow"

# SIG-290 v1: anti-hallucination absence-grounding gate. Suppress/downgrade
# "absence-claim" findings (e.g. "lacks tests", "no null check", "missing
# validation") when the evidence that would confirm-or-refute the absence
# was PROVABLY not in the specialist's window (the sibling test was never
# inspected, or the cited path was dropped from the diff) — because then
# the bot was GUESSING. "off" (default) skips the gate; "shadow" counts +
# telemeters the would-demote but keeps every finding inline (zero behavior
# change); "enforce" demotes the ungrounded absence-claim to the review
# body (never hard-drops). Start "off" until the shadow data is read.
# Rollback: set "off" (or remove the line).
# SIG-290 (2026-05-30): flipped off → shadow to START the measurement. The gate
# now runs + emits the `pr-review-finding-rejected-validation` (gate:"absence-
# grounding") telemetry on every review, but KEEPS every finding inline — zero
# behavior change. Read the firing rate + suppression-fp-rate before "enforce".
OPENCLAW_ABSENCE_CLAIM_VALIDATOR_MODE = "shadow"

# SIG-293 v1: security-grounding gate (secrets-exposure). The deeper root of
# Pattern A (#248): where Pattern A only de-alarmed the "revoke and rotate"
# remediation text, this gate demotes the whole finding. A "secrets-exposure"
# (CWE-798) finding is only believable when the cited code actually CONTAINS a
# credential token (containsCredentialToken). One whose cited line holds no
# credential (the #243 FP: a sev-3 finding that misread `console.log(x.length)`
# as a leak) is a hallucination. v1 gates ONLY secrets-exposure — the single
# HIGH-detectability category (a line either has a credential-shaped token or it
# doesn't); injection/xss/path-traversal look identical parameterised-vs-
# concatenated at the line level (gating them risks false-negatives), and authn/
# ssrf/etc. are absences with no line signature. A corroborating scanner fact
# ALWAYS keeps. "off" (default) skips the gate; "shadow" counts + telemeters the
# would-demote but keeps every finding inline (zero behavior change); "enforce"
# demotes to the body (never hard-drops). Read the firing rate + suppression-fp-
# rate (kill > 2%) before "enforce". Rollback: set "off" (or remove the line).
# SIG-293 (2026-05-30): landed at shadow to START the measurement immediately —
# the gate runs + emits `pr-review-finding-rejected-validation` (gate:"security-
# grounding") on every review but KEEPS every finding inline.
OPENCLAW_SECURITY_GROUNDING_VALIDATOR_MODE = "shadow"

# SIG-224 Phase 1.5: enable the legacy rule-based router's safe-skip
# shortcuts. The router lives at `src/lib/ensemble-router.ts` and has
# been dormant since Phase 4a "baseline data collection" for months.
# Enabling it activates the deterministic shortcuts that the SIG-226
# shadow dispatcher's rule layer also relies on:
#
#   docs-only-no-executable-fences → run 0 specialists (green check,
#     no comment) — was 5-8min total, becomes ~10s
#   CSS-only → run only `performance` — was 5-8min, becomes ~120s
#   auth/lockfile/schema/migration paths → force security (no skip;
#     additive to the default "all four run" behavior)
#
# Pre-req fix landed in PR #182 (SIG-224 Phase 0): the
# `router.specialists.length === 0` branch now finalizes as "skipped
# → success" (green check, no comment) instead of the prior
# "bailWithSkipNotice" → "Couldn't review · see PR comment" yellow
# check. Without that fix, docs-only PRs would have rendered a
# customer-visible "Couldn't review" comment when the flag flipped.
#
# Rollback: flip back to "off" or remove this line. No data migration,
# no schema change. Worst-case observable regression: a docs-only-no-
# fences PR shows a "Sigilix · Approved — no issues found" check with
# no inline findings (which is correct for a docs PR).
OPENCLAW_ENSEMBLE_ROUTER_ENABLED = "on"

# SIG-228 Phase 3c — synth-bypass single-specialist hot path. When "on",
# the orchestrator skips the synthesizer LLM round-trip entirely when
# the dispatcher returns exactly 1 specialist AND none of that
# specialist's findings have `score >= 4` (major/critical). The
# specialist's verdict becomes the submission directly. Saves ~15-25s
# on the hot path (the typical `gpt-oss:120b-cloud` synth elapsed
# window).
#
# Bypass eligibility ladder (helper: `isSynthBypassEligible`):
#   1. This flag === "on"
#   2. `SHADOW_BAKEOFF_ROLES` does NOT include "synth" (so the
#      bake-off signal on the bypass-eligible cohort isn't halved)
#   3. Dispatcher narrowed to exactly 1 specialist on purpose
#   4. Exactly 1 specialist verdict came back non-null
#   5. No finding has `score >= 4`
#
# Safe by construction: no cross-specialist consensus to compute on the
# 1-role path, and the score-gate keeps anything major routed through
# the full synth pipeline so synth-level severity rewriting still fires
# when it matters. Rollback: flip to "off" or remove this line — no
# schema change, no migration. Default-off in dev/test (the env var
# is unset there).
OPENCLAW_SYNTH_BYPASS_ENABLED = "on"

# SIG-235 — min-specialists early exit. Three-state rollout:
#   "off"     — fan-out waits for ALL dispatched specialists to settle.
#   "shadow"  — fan-out STILL waits for all, but emits
#               `ensemble-min-specialists-early-exit-would-fire`
#               telemetry the moment N-1 of N specialists return. Used
#               to size the win + validate the cancel pattern without
#               actually changing fan-out semantics. SHIPPING IN THIS
#               STATE FIRST so we have a validation window before
#               enforcing.
#   "on"      — cancels laggard role(s) via per-role AbortController
#               and proceeds to synth as soon as N-1 of N succeed.
#               Synth runs on the partial input with the existing
#               [DEGRADED COVERAGE] block. Late verdicts from the
#               cancelled role are logged (`ensemble-late-verdict-
#               discarded`) but discarded — the synth has already run.
#
# Rollout plan: ship "shadow" → bake 1-2 days / 50+ reviews → flip "on"
# in a follow-up one-line PR. Rollback = flip back to "off"; per-role
# AbortControllers are added in either mode, but the cancel logic only
# fires on "on", so flipping back is safe.
OPENCLAW_MIN_SPECIALISTS_EARLY_EXIT = "shadow"

# SIG-236 — surgical prompt-budget telemetry for the logic specialist.
# Three-state rollout:
#   "off"     — no telemetry, no truncation (default).
#   "shadow"  — measure the constructed logic prompt's per-section size
#               + emit `logic-prompt-budget` telemetry; the prompt
#               passes through untouched. Used to size the enforce-mode
#               cuts before flipping. SHIPPING IN THIS STATE FIRST so
#               we have ~24-48h / 30+ logic-dispatched PRs of data
#               before designing the actual cuts.
#   "enforce" — NOT YET IMPLEMENTED. Currently behaves like shadow but
#               records `mode: "enforce-pending"` in the event so a
#               premature flip is observable. The actual truncation
#               + per-role schema with `findings.maxItems: 3-4` lands
#               in a follow-up PR informed by shadow data.
#
# Codex-recommended target cap: 6_000 input tokens (vs current
# unbounded). Logic's prompt is empirically uniquely-expensive — same
# 60s timeout on two different model families on PR #188 — and trimming
# graph context + symbol retrieval + Vectorize retrieval should let
# models actually return a verdict.
# SIG-287: ENFORCE (was "shadow") — the logic specialist was timing out on
# ~every review (prompt-bound 60s), so reviews ran degraded and the bot
# fake-approved. Enforcing the ≤6K budget lets logic actually return a verdict.
OPENCLAW_LOGIC_PROMPT_BUDGET = "enforce"

# SIG-161 confidence-threshold verdict gate. Three-state rollout:
#   "off"     — gate bypassed; verdict is the legacy `findings.length > 0`.
#               Identical behavior to pre-SIG-161. This is the PR 4a default.
#   "shadow"  — gate runs but ships the legacy verdict; the new verdict is
#               logged to ValidationMetricsDO for divergence analysis.
#               Flips in PR 4b.
#   "enforce" — gate ships its verdict (REQUEST_CHANGES / COMMENT / APPROVE).
#               Flips in PR 4c after stage-1 calibration is committed.
#
# The threshold + model artifact live in KV (NOT here) so a calibration
# retune is a `wrangler kv:key put` not a redeploy. See DESIGN.md §9.
#   KV key  config:gate-threshold:v1   number  (default 1.0 = never block)
#   KV key  config:gate-model:v1       JSON    (logistic-regression coefs;
#                                               default null = use hand-blend)
# Cache TTL 60s in the Worker so updates take effect on the next request.
OPENCLAW_GATE = "shadow"

# Consumer binding — DEFERRED out of wrangler.toml because Cloudflare's
# Queue API rejects re-registering a consumer that's already bound to
# this same script (HTTP 11004 — "Queue already has a consumer"), and
# the CF Workers Builds CI re-runs `wrangler deploy` on every push. The
# initial registration was done once via `wrangler deploy` from a local
# checkout after the openclaw-worker → sigilix cutover; subsequent
# deploys must not try to re-register, or CI fails.
#
# The consumer is still active — bound at the dashboard / queue level,
# not at deploy time. `src/index.ts` still exports a `queue()` handler
# that processes openclaw-jobs messages.
#
# To rebind manually if it ever comes loose:
#   npx wrangler queues consumer add openclaw-jobs sigilix \
#     --batch-size 1 --max-concurrency 5 --max-retries 3 --batch-timeout 1
# Or via dashboard: Workers & Pages → openclaw-jobs (queue) → Settings
# → Consumers → Add consumer → pick `sigilix`.
#
# [[queues.consumers]]
# queue = "openclaw-jobs"
# max_batch_size = 1
# max_concurrency = 5
# max_retries = 3
# max_batch_timeout = 1

# Required secrets (set via `wrangler secret put`):
#
#   LINEAR_API_KEY                Personal API key — used as the manual-trigger
#                                 route's bearer secret AND as the Linear API
#                                 fallback when OAuth isn't configured.
#                                 Linear → Settings → API → Personal API keys
#   LINEAR_WEBHOOK_SECRET         Signing secret from the Linear webhook config.
#                                 Used to verify the HMAC on every webhook delivery.
#   OLLAMA_API_KEY                Ollama Turbo API key (https://ollama.com/settings/keys)
#
# Optional (recommended for production — gives the Worker its own bot identity):
#
#   LINEAR_OAUTH_CLIENT_ID        OAuth app client_id from Linear → Settings →
#   LINEAR_OAUTH_CLIENT_SECRET    API → OAuth applications. Together they let
#                                 the Worker mint a 30-day app-actor token via
#                                 client_credentials. Comments and field
#                                 updates then appear as the OAuth app rather
#                                 than the human owner of LINEAR_API_KEY.
#
# Required for the GitHub webhook routes (PR overview, CI triage, CR eval,
# proactive PR review). Without these the /github/webhook route returns 503
# — we never want to fall back to a developer's PAT for PR-side actions.
#
#   GITHUB_APP_ID                 Numeric App ID from
#                                 https://github.com/organizations/Arc-and-Anchor/settings/apps/<app-name>
#   GITHUB_PRIVATE_KEY            PEM-encoded RSA private key (PKCS#1 or PKCS#8).
#                                 GitHub's "Generate a private key" button
#                                 downloads PKCS#1 — paste it as-is.
#   GITHUB_WEBHOOK_SECRET         HMAC secret on the App's webhook config.
#                                 Used to verify X-Hub-Signature-256 on every
#                                 inbound delivery.
#
# Required GitHub App permissions:
#   Repository → Actions: Read       (CI logs)
#   Repository → Checks: Write       (ARC-258 in-progress reviewer check)
#   Repository → Contents: Read      (file contents at a given ref)
#   Repository → Issues: Write       (top-level PR comments)
#   Repository → Pull requests: R/W  (PR diff, review comments, submit review)
#   Repository → Metadata: Read      (default)
#
# Required GitHub App webhook events:
#   installation                  (initial indexing + uninstall cleanup)
#   installation_repositories     (repos added/removed indexing + cleanup)
#   pull_request                  (opened, synchronize, ready_for_review, reopened)
#   push                          (default/dev/active-PR branch re-indexing)
#   workflow_run                  (CI failure triage)
#   issue_comment                 (top-level PR conversation @-mentions)
#   pull_request_review_comment   (inline PR review comment @-mentions)
#
# Optional (other):
#   OPENCLAW_MODEL                Override the default model (defaults to glm-5.1:cloud)
#   OPENCLAW_TEAM_KEY             Linear team key to scope to (e.g. "ARC")
#   OPENCLAW_VALIDATION_METRICS_TOKEN
#                                 SIG-119 — shared-secret bearer token guarding
#                                 GET /metrics/validation (validator shadow
#                                 telemetry). If UNSET the endpoint returns 503
#                                 (disabled); a missing/wrong bearer returns 401.
#                                 Set via `wrangler secret put`.
#
# Optional (Phase 5 user-OAuth — required only for /auth/* routes; if
# unset, /auth/github + /auth/github/callback return 503 and the rest
# of the Worker is unaffected). See `.claude/handoff/arc-phase5-auth-spec-v2-LOCKED.md`.
#
#   GITHUB_OAUTH_CLIENT_ID        OAuth client_id from the same GitHub App as
#   GITHUB_OAUTH_CLIENT_SECRET    GITHUB_APP_ID. The App settings page exposes
#                                 both server-to-server (JWT, used for repo
#                                 access) AND user-to-server (OAuth, used to
#                                 sign humans into the app.sigilix.ai dashboard).
#   OPENCLAW_SESSION_ENCRYPTION_KEY  32 random bytes, base64url-encoded. Used to
#                                 AES-GCM-encrypt user access tokens at rest in
#                                 OPENCLAW_STATE. Generate with:
#                                 openssl rand 32 | basenc --base64url -w0
#                                 Rotating this invalidates every active session.
#   OPENCLAW_BASE_URL             Public origin for OAuth callbacks (must match
#                                 the GitHub App's configured callback URL).
#                                 Defaults to https://app.sigilix.ai when unset.
#
# GitHub App callback URL (required for OAuth): set on the App settings page →
# Identifying and authorizing users → User authorization callback URL:
#   https://app.sigilix.ai/auth/github/callback

# SIG-156 PR3: index reconciliation cron. Every 6h, walk all installations
# + their repos and enqueue an index-repo job for any repo missing a
# manifest in KV. Self-heals dropped install / repos-added webhooks (the
# gap that left every install dark before PR2's backfill). Idempotent and
# cheap to run more often if needed — the cost is one KV read per repo
# + one queue send per missing repo.
[triggers]
crons = ["0 */6 * * *"]

# Workers Logs subsection — pairs with the top-level [observability]
# block at the top of this file. `enabled = true` opts log events
# into the searchable Workers Logs dataset (7-day retention).
# `invocation_logs = true` adds a synthetic per-invocation request
# line so webhook deliveries are visible even when triage emits
# nothing — invaluable for "did the webhook even arrive?" debugging.
# Required for the monitoring-app initiative: the sigilix-trace-
# events-r2 Logpush job subscribes to the same upstream Trace Events
# stream that the parent [observability] block enables.
[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

# Environment-specific overrides go below as `[env.production]`,
# `[env.staging]`, etc. The default config above is what `wrangler deploy`
# uses when no `--env` flag is passed.
