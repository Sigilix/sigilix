# Re-indexes this repo into the Sigilix Cloudflare Vectorize store on
# every push to `main`. The bot then knows about its own source code
# and can answer "what does the worker do?" / "where is X handled?" type
# questions about itself. (No `dev` branch on this repo — `main` is
# direct.)
#
# Implementation lives in this same repo at
# `.github/workflows/codebase-index.yml`. We call it via `uses:` so the
# indexer logic and its callers share the exact same code path that
# every other Arc-and-Anchor repo runs. The self-reference (`./...`)
# is required after the openclaw-worker → sigilix rename — `uses:` on
# an absolute org/repo path does not follow GitHub's rename redirects
# (ARC-169).
#
# Required org-level secrets (set once at
# https://github.com/organizations/Arc-and-Anchor/settings/secrets/actions
# with access granted to all repos that need to index):
#   - CLOUDFLARE_ACCOUNT_ID
#   - CLOUDFLARE_AI_TOKEN     (Workers AI Read + Vectorize Edit)
#   - OPENCLAW_REPO_TOKEN     (fine-grained PAT, Contents:Read on
#                              Arc-and-Anchor/sigilix — required by the
#                              reusable workflow even when self-indexing,
#                              since the second checkout clones the
#                              indexer source)

name: OpenClaw codebase index

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  index:
    uses: ./.github/workflows/codebase-index.yml
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
      OPENCLAW_REPO_TOKEN: ${{ secrets.OPENCLAW_REPO_TOKEN }}
