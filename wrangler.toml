# Worker name — drives the deploy URL (e.g.
# `sigilix.<account>.workers.dev`) and is what GitHub / Linear webhook
# configs point at. Renamed from `openclaw-worker` during the Sigilix
# rebrand. KV/Queue/Vectorize binding NAMES still use the legacy
# `OPENCLAW_*` prefix (deferred to a follow-up to avoid churning ~100
# `env.OPENCLAW_*` references in code in the same PR — bindings are
# internal, not user-visible, so the visible-surface rebrand can ship
# first).
name = "sigilix"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# Workers Trace Events Logpush opt-in — required for the
# sigilix-trace-events-r2 Logpush job (R2 bucket: sigilix-telemetry)
# to receive any data. Without this, the Worker emits zero records
# to the workers_trace_events dataset and the Logpush job pushes
# empty batches. Independent from the [observability] block below:
# both subscribe to the same upstream Trace Events stream but are
# billed separately (Logpush is a paid add-on; Workers Logs is
# included in Workers Paid).
logpush = true

# Workers Logs — in-dashboard searchable log viewer with 7-day
# retention. Mirror of the dashboard Observability toggle; wrangler
# is the source of truth at deploy time, so toggling in the dashboard
# alone would be reverted on next `wrangler deploy`.
[observability]
enabled = true
head_sampling_rate = 1

# Standard usage model — Bundled gives ctx.waitUntil() only ~30s of
# wall-clock budget after the response, which Ollama Turbo blows past
# routinely (its calls take 30-90s for a description rewrite). On
# Standard we get up to 30 min of waitUntil time and an explicit CPU
# budget in milliseconds, which is what the triage path needs.
#
# The legacy `usage_model = "unbound"` directive was removed in
# wrangler 4 and is silently ignored — the Worker was actually
# running on the Bundled default, which was killing waitUntil mid-
# triage and leaving every test issue with no comment / no rewrite.
[limits]
cpu_ms = 300000

# KV namespace for dedupe state.
# Stores marker comment IDs by issue identifier so re-firing
# webhooks edit-in-place instead of duplicating triage comments.
# Replaces the file-on-disk poll-state.json the Node daemon used.
#
# Run once: `wrangler kv:namespace create OPENCLAW_STATE`
# Then paste the returned ID below.
[[kv_namespaces]]
binding = "OPENCLAW_STATE"
id = "df689379ea6240f7808997a75ceaed7e"

# Vectorize index for codebase chunks. Embeddings are 768-dim vectors
# from Cloudflare's @cf/baai/bge-base-en-v1.5, indexed under one
# namespace per repo (e.g. "rubberfit", "rubberfit-desktop") so
# triage on a Linear issue can scope retrieval to the relevant repo.
#
# Run once: `wrangler vectorize create openclaw-code-index \
#   --dimensions=768 --metric=cosine`
# Then populate via scripts/index-repo.mjs (see README).
[[vectorize]]
binding = "OPENCLAW_CODE_INDEX"
index_name = "openclaw-code-index"

# SIG-45: D1 database holding the FTS5 (BM25) lexical mirror of the code
# chunks for hybrid retrieval. The indexer dual-writes here alongside the
# Vectorize upsert; PR-review retrieval queries it in parallel with the
# vector index and fuses via RRF — all gated behind OPENCLAW_RETRIEVAL_HYBRID.
#
# COMMENTED OUT until the D1 database is provisioned: the CF Workers Builds CI
# runs `wrangler deploy` on every push, and a binding with an empty
# `database_id` can fail that deploy. The code treats OPENCLAW_LEXICAL_INDEX as
# OPTIONAL — when the binding is absent, the indexer dual-write and the hybrid
# read both no-op, so hybrid retrieval simply stays dark with zero deploy risk.
#
# To enable: run `wrangler d1 create sigilix-lexical-index`, uncomment the
# block below, paste the returned database_id, deploy (the indexer starts
# populating the FTS5 mirror — schema is created lazily, no migration step),
# then flip OPENCLAW_RETRIEVAL_HYBRID=on once there's a corpus to query.
#
# [[d1_databases]]
# binding = "OPENCLAW_LEXICAL_INDEX"
# database_name = "sigilix-lexical-index"
# database_id = ""  # set after `wrangler d1 create sigilix-lexical-index`

# Cloudflare Workers AI binding — used for embedding the issue/comment
# body at query time. Keeps the embedding model identical between
# index time (CLI/CI script also calls @cf/baai/bge-base-en-v1.5 via
# the REST API) and retrieval time, which is critical for cosine sim
# to be meaningful.
[ai]
binding = "AI"

# Cloudflare Queue — `ctx.waitUntil()` has a hard 30s cap that's not
# configurable on any plan, and Ollama Turbo calls (Kimi/GLM) routinely
# take 30-90s. Webhooks now enqueue a JobMessage and return 200 fast
# (~50ms); the queue consumer below processes the job with up to 15
# minutes of wall-clock time per Cloudflare's documented limits.
#
# Run once before first deploy:
#   npx wrangler queues create openclaw-jobs
#
# Producer binding — the fetch handler `.send()`s here.
[[queues.producers]]
binding = "OPENCLAW_JOBS"
queue = "openclaw-jobs"

# ARC-190: Durable Object for per-PR review-run state. Spec at
# docs/superpowers/specs/2026-05-07-arc-190-durable-objects-webhook-ingest-design.md.
# DO orchestrates dedupe + retry + watchdog for `pr-review` work; the
# existing OPENCLAW_JOBS queue still executes the actual review (DOs
# are time- and memory-capped, ensemble runs are 60-180s).
[[durable_objects.bindings]]
name = "PR_REVIEW_RUN"
class_name = "PrReviewRunDO"

# SIG-138: per-repo code/dependency graph stored in SQLite DO storage.
# Keyed by `indexNamespace(owner, repo)` (one DO instance per repo).
# Flag-gated behind OPENCLAW_GRAPH_INDEX / OPENCLAW_GRAPH_RETRIEVAL.
[[durable_objects.bindings]]
name = "REPO_GRAPH_DO"
class_name = "RepoGraphDO"

# SIG-119: single global DO holding rolling per-gate validator shadow
# telemetry (would-drop / kept daily buckets, 35-day retention). One
# instance (idFromName("global")); read via the authenticated
# GET /metrics/validation endpoint guarded by
# OPENCLAW_VALIDATION_METRICS_TOKEN.
[[durable_objects.bindings]]
name = "VALIDATION_METRICS_DO"
class_name = "ValidationMetricsDO"

# SIG-152: single global DO holding rolling daily aggregates of the SIG-138
# `pr-review-graph-retrieval` shadow sample (avg jaccard / added-context /
# blast counts, 35-day retention). Read via GET /metrics/graph (same
# OPENCLAW_VALIDATION_METRICS_TOKEN bearer).
[[durable_objects.bindings]]
name = "GRAPH_METRICS_DO"
class_name = "GraphMetricsDO"

# SIG-184: per-repo-sharded DO enforcing single-use of a runner-evidence receipt
# (repository_id, sha, run_id, run_attempt) + holding the defensible record
# (SQLite). Sharded by repository_id (idFromName). Not exercised until the
# OPENCLAW_RUNNER_* config is set.
[[durable_objects.bindings]]
name = "RUNNER_RECEIPT_DO"
class_name = "RunnerReceiptDO"

# SIG-184 PR 5b: single global DO holding rolling runner-evidence presence
# counters (state × evidence-pending-reason daily buckets + per-repo latest
# state, 35-day retention). Read via GET /metrics/runner-evidence (same
# OPENCLAW_VALIDATION_METRICS_TOKEN bearer as the other /metrics/* endpoints).
[[durable_objects.bindings]]
name = "RUNNER_EVIDENCE_METRICS_DO"
class_name = "RunnerEvidenceMetricsDO"

# SIG-107: single global DO holding accepted runner scan-manifest telemetry by
# deterministic tool/status. Read via GET /metrics/runner-tools (same
# OPENCLAW_VALIDATION_METRICS_TOKEN bearer as the other /metrics/* endpoints).
[[durable_objects.bindings]]
name = "RUNNER_TOOL_METRICS_DO"
class_name = "RunnerToolMetricsDO"

# SIG-285 PR 2: single global DO holding rolling verification-by-execution
# verdict counters (confirmed/refuted/inconclusive/no-check × category daily
# buckets, 35-day retention). Read via GET /metrics/verification (same
# OPENCLAW_VALIDATION_METRICS_TOKEN bearer).
[[durable_objects.bindings]]
name = "VERIFICATION_METRICS_DO"
class_name = "VerificationMetricsDO"

# SIG-286 PR2.5: single global DO holding rolling graph-context-expansion shadow
# aggregates (netNewTokens histogram → median, cross-file rates, fetch cost,
# 35-day retention). Read via GET /metrics/graph-expansion (same
# OPENCLAW_VALIDATION_METRICS_TOKEN bearer). Telemetry-only — nothing here
# changes a posted review.
[[durable_objects.bindings]]
name = "GRAPH_EXPANSION_METRICS_DO"
class_name = "GraphExpansionMetricsDO"

# Migration block — adds the DO class. Forward-only; use
# `new_classes` (KV-backed DO storage) per spec §4.8 — v1 access is
# point-lookup; SQLite buys nothing.
[[migrations]]
tag = "arc-190-v1"
new_classes = ["PrReviewRunDO"]

# SIG-138: RepoGraphDO uses SQLite storage (new_sqlite_classes).
# Sequential migration tag after arc-190-v1.
[[migrations]]
tag = "sig-138-v1"
new_sqlite_classes = ["RepoGraphDO"]

# SIG-119: ValidationMetricsDO uses SQLite storage. Forward-only; reverting
# this PR is safe (no data written until the endpoint is exercised).
[[migrations]]
tag = "sig-119-v1"
new_sqlite_classes = ["ValidationMetricsDO"]

# SIG-152: GraphMetricsDO uses SQLite storage. Forward-only.
[[migrations]]
tag = "sig-152-v1"
new_sqlite_classes = ["GraphMetricsDO"]

# SIG-184: RunnerReceiptDO uses SQLite storage. Forward-only; reverting is safe
# (no data is written until the runner-ingest route is exercised, which needs the
# OPENCLAW_RUNNER_* config set first).
[[migrations]]
tag = "sig-184-v1"
new_sqlite_classes = ["RunnerReceiptDO"]

# SIG-184 PR 5b: RunnerEvidenceMetricsDO uses SQLite storage. Forward-only;
# reverting is safe (telemetry-only — no review behavior depends on it).
[[migrations]]
tag = "sig-184-metrics-v1"
new_sqlite_classes = ["RunnerEvidenceMetricsDO"]

# SIG-285 PR 2: VerificationMetricsDO uses SQLite storage. Forward-only;
# reverting is safe (telemetry-only — no review behavior depends on it).
[[migrations]]
tag = "sig-285-metrics-v1"
new_sqlite_classes = ["VerificationMetricsDO"]

# SIG-286 PR2.5: GraphExpansionMetricsDO uses SQLite storage. Forward-only;
# reverting is safe (telemetry-only — no review behavior depends on it).
[[migrations]]
tag = "sig-286-metrics-v1"
new_sqlite_classes = ["GraphExpansionMetricsDO"]

# SIG-107: RunnerToolMetricsDO uses SQLite storage. Forward-only; reverting is
# safe (accepted scan-manifest telemetry only, no review behavior depends on it).
[[migrations]]
tag = "sig-107-tool-metrics-v1"
new_sqlite_classes = ["RunnerToolMetricsDO"]

# ARC-190 env-var documentation (set via `wrangler secret put` or
# wrangler.toml [vars]):
#   OPENCLAW_PR_REVIEW_DO_MAX_RETRIES    # numeric; clamped [1, 10], default 3
#   OPENCLAW_PR_REVIEW_DO_WATCHDOG_MS    # numeric; clamped [60000, 1800000] ms, default 1200000 (20 min)
#   OPENCLAW_PR_REVIEW_DO_HISTORY_LIMIT  # numeric; clamped [1, 100], default 10
#
# SIG-184 runner-evidence ingest (POST /runner/ingest) — both UNSET for now; the
# route returns 503 until they're provided (values come from the Sigilix runner
# repo, PR 4). Non-secret → set in [vars] below or via the dashboard when ready:
#   OPENCLAW_RUNNER_OIDC_AUDIENCE        # the `aud` the runner mints its OIDC token with
#   OPENCLAW_RUNNER_WORKFLOW_REF         # pinned reusable-workflow `owner/repo/path` (no @ref)
# ARC-283 Phase B1b — shadow-mode model bake-off:
#   SHADOW_BAKEOFF_ROLES                 # CSV of "logic"|"security"|"performance"|"tests"|"synth"
#                                        # (default "" — shadow off everywhere). When set, the
#                                        # candidate lineup defined in lib/shadow-bakeoff-config.ts
#                                        # fires in parallel with prod on every PR review and emits
#                                        # `shadow-verdict-comparison` telemetry. Shadow output is
#                                        # NEVER posted to GitHub. Set via `wrangler secret put` for
#                                        # production, or the [vars] block below for local/preview.
#                                        # See docs/ops/shadow-bakeoff.md for rollout guidance.

# Plaintext env vars (non-secret). Secrets go through `wrangler secret
# put` instead — `[vars]` is for values that are safe to commit and
# need a default at deploy time.
[vars]
# SIG-234 (2026-05-26): bake-off DISABLED because production now runs
# the lineup that the bake-off was validating. The bake-off candidate
# config in `src/lib/shadow-bakeoff-config.ts` is preserved as a
# code-level record of Codex's ARC-292 analysis; flip back to a
# non-empty CSV ("synth", "synth,security,tests", etc.) to bake-off
# against the OLD lineup or a future candidate set. Empty string =
# bake-off off, no shadow telemetry, no extra LLM spend per review.
#
# Historical (pre-SIG-234): ARC-283 Phase B1b shipped on 2026-05-18
# with `synth` role enabled for bake-off, with `security,tests`,
# `performance`, `logic` queued. SIG-234 graduated the entire lineup
# directly (informed by format-compatibility curl-tests against
# Ollama Cloud); the bake-off no longer has a current target.
SHADOW_BAKEOFF_ROLES = ""

# SIG-138 code/dependency graph (Greptile-parity). Both default OFF.
#   OPENCLAW_GRAPH_INDEX     "off" | "shadow" | "on"  — graph WRITER in the
#                            indexer (extract + RepoGraphDO upsert/commit).
#   OPENCLAW_GRAPH_RETRIEVAL "off" | "shadow" | "post" — graph EXPANSION of
#                            vector hits in PR review (Phase 2).
# Shadow emits telemetry only; neither changes posted review output. Flip to
# "shadow" per phase after acceptance review, then "on"/"post" once the
# bake-off telemetry is reviewed.
# SIG-152 (2026-05-22): flipped to "shadow" to start live graph shadow
# validation. Both paths are additive — indexer writes the graph, PR review
# computes graph expansion + emits `pr-review-graph-retrieval`, but posted
# review output is unchanged in shadow. Read the telemetry via GET
# /metrics/graph.
#
# SIG-138 (2026-05-22): RETRIEVAL flipped to "post" after shadow acceptance —
# /metrics/graph showed real grounded context (nodeCount/addedCount/blast >0
# across multi-repo PR reviews once the SIG-156 backfill landed). In "post",
# the graph block now INJECTS context into the logic/tests/synth prompts (not
# just telemetry). The INDEX flag stays "shadow" (`graphIndexEnabled` treats
# "on" and "shadow" identically, so no behavior change there).
OPENCLAW_GRAPH_INDEX = "shadow"
OPENCLAW_GRAPH_RETRIEVAL = "post"

# SIG-286 graph-context body EXPANSION ("off" | "shadow" | "post"). Default OFF.
# Both modes COMPUTE the enriched changed-symbol context (definition / caller /
# import-dependent bodies) and emit the `graph-expansion-shadow` telemetry.
# `shadow` does NOT touch the prompt; `post` (PR1/PR2) runs the TARGETED inject
# as a CONTROL/TREATMENT A/B — among reviews with net-new cross-file context,
# TREATMENT appends `renderGraphExpansionForPrompt` to logic+tests+synth while
# CONTROL does not, both tagged on `telemetry.graphExpansionAb.arm` so a per-arm
# finding-rate read (PR3) can tell whether the inject catches MORE real findings.
# SIG-286 (2026-06-01): flipped shadow → post to START the A/B. The blanket
# inject was a pre-registered KILL (median net-new tokens 0); this measures the
# targeted version. Rollback: set "shadow" (inject stops; telemetry continues).
OPENCLAW_GRAPH_EXPANSION = "post"

# SIG-314 (2026-06-02): deterministic IDOR/BOLA floor (no-unauthorized-object-
# lookup AST rule). Run-invariant insurance so the obvious in-diff IDOR the
# security specialist catches only nondeterministically (pr/08: caught keys.ts,
# dropped the workspaces BOLA) is never fully missed. The rule always RUNS (the
# runner logs each hit), but its emits reach the synth/post ONLY in "post";
# "off" strips silently, "shadow" strips-but-logs an `authz-idor-shadow` rollup.
# Shipping at "post" (founder call 2026-06-02): structurally P2-capped
# (clampAstEmitScores) so it can NEVER post a P0/P1 on its own; a specialist that
# independently escalates the same line still stands; and there are no customers
# yet, so live traffic is dogfood + e2e benchmark only. The residual risk is a P2
# advisory on a middleware-only-authz handler (no in-body principal proxy) —
# internal noise, not a believability incident. Rollback: "shadow" (measure-only)
# or "off".
OPENCLAW_AUTHZ_IDOR_SCAN = "post"
# Deterministic weak-randomness floor (CWE-338, no-insecure-random-token): flags
# Math.random() minting a credential-named token/secret. P2-capped
# (clampAstEmitScores: never a P0/P1 alone). Promoted shadow→"post" 2026-06-04.
OPENCLAW_WEAK_RANDOM_SCAN = "post"
# Deterministic open-redirect floor (CWE-601, no-open-redirect): flags a
# request-controlled value flowing into a redirect/Location sink with no
# destination validation. P2-capped (clampAstEmitScores: never a P0/P1 alone).
# Shipped at "post" — fail-closed taint + Headers-receiver gating keep FPs out.
OPENCLAW_OPEN_REDIRECT_SCAN = "post"
# Deterministic SSRF floor (CWE-918, no-ssrf): flags a request-controlled value
# reaching a server-side fetch sink (fetch/axios/http(s)/got/ky) whose authority
# the request can control, with no host validation. P2-capped (clampAstEmitScores:
# never a P0/P1 alone). Promoted shadow→"post" 2026-06-04 (founder-authorized;
# watch the review stream for FPs — rollback is this flag back to "shadow").
OPENCLAW_SSRF_SCAN = "post"
# Deterministic path-traversal floor (CWE-22, no-path-traversal): flags a
# request-controlled value reaching a filesystem path op (fs.*/sendFile/Deno) with
# no path sanitization (basename / within-root check). No fixed-prefix exemption —
# `../` escapes a base. P2-capped (clampAstEmitScores: never a P0/P1 alone).
# Promoted shadow→"post" 2026-06-04 (founder-authorized; rollback = "shadow").
OPENCLAW_PATH_TRAVERSAL_SCAN = "post"
# Deterministic SQL-injection floor (CWE-89, no-sql-injection): flags a request-
# controlled value concatenated into a raw SQL string at a query sink (.query/
# .execute/.exec/.prepare/.raw + raw-named $queryRawUnsafe/whereRaw). Parameterized
# queries (taint in the params, not the SQL string) + tagged-template queries are
# auto-safe. P2-capped (clampAstEmitScores: never a P0/P1 alone). Promoted shadow→
# "post" 2026-06-05 on the floor-eval ruler (0% FP / 100% recall across the corpus).
OPENCLAW_SQL_INJECTION_SCAN = "post"
# Deterministic SSTI floor (CWE-1336, no-ssti): flags a request-controlled value
# used as the TEMPLATE source of a template engine (handlebars/ejs/pug/nunjucks/
# eta/_.template .compile/.render/.renderString). The SAFE use (constant template +
# user data as the SEPARATE render arg) is auto-excluded (taint must be in arg 0).
# P2-capped (clampAstEmitScores: never a P0/P1 alone). Promoted shadow→"post"
# 2026-06-05 on the floor-eval ruler (0% FP / 100% recall across the corpus).
OPENCLAW_SSTI_SCAN = "post"
# Deterministic NoSQL-injection floor (CWE-943, no-nosql-injection): flags a
# request-controlled object handed DIRECTLY to a Mongo query as the filter
# (find/findOne/updateMany/deleteMany/aggregate(req.query|req.body|alias)) or a
# tainted $where/$function operator. The SAFE idiom (fixed-shape literal with a
# tainted scalar field, array .find(cb), lodash) is auto-excluded. P2-capped
# (clampAstEmitScores: never a P0/P1 alone). Promoted shadow→"post" 2026-06-05 on
# the floor-eval ruler (no-nosql-injection = 100% recall / 0% FP across the corpus).
OPENCLAW_NOSQL_INJECTION_SCAN = "post"
# Deterministic prototype-pollution floor (CWE-1321, no-prototype-pollution): flags a
# request-controlled object RECURSIVELY merged into a target (_.merge/defaultsDeep/
# mergeWith/deepmerge) — the lodash CVE-2019-10744 shape. SAFE: Object.assign (shallow),
# bare merge on a non-lodash receiver, non-tainted sources, a __proto__ guard, and
# user-keyed dynamic-dict writes are all excluded. P2-capped (never a P0/P1). Shipped "shadow".
OPENCLAW_PROTO_POLLUTION_SCAN = "shadow"
# Deterministic XXE floor (CWE-611, no-xxe): flags an XML parse with external-entity
# / DTD resolution EXPLICITLY enabled (noent/replaceEntities/resolveExternalEntities/
# dtdload/…) on request-controlled input — e.g. libxmljs.parseXml(req.body.xml,
# { noent: true }). SAFE: no option (default-off), an explicitly-false option, and
# constant/non-request input are all excluded. P2-capped (never a P0/P1). Shipped "shadow".
OPENCLAW_XXE_SCAN = "shadow"
# Lane D: ingest a repo's own AI-instruction files (CLAUDE.md / AGENTS.md /
# .cursorrules / .github/copilot-instructions.md) as ADVISORY review guidance when
# no sigilix.json guidance is set (parity with CodeRabbit). "off" disables.
OPENCLAW_INGEST_AI_INSTRUCTIONS = "on"

# SIG-317 (2026-06-02): synth verdict-truncation recovery. On target-rich PRs the
# synthesizer writes a COMPLETE provenance.findings but a SHORTER verdict.findings
# (it details the top-ranked findings and truncates the verbose tail), silently
# losing real subtle findings it marked KEPT — pr/10: provenance 20 / verdict 8,
# a score-5 N+1 + the cents bug + a floating promise lost. Recovery reconstructs
# the tail from the cited specialist sources; recovered findings flow through the
# SAME post-synth gates, so it cannot lower precision. "off" inert, "shadow" logs
# the `pr-review-synth-truncation-recovered` count, "on" applies. Precision-safe
# by construction (recovers only synth-provenanced-kept findings, never invents;
# the gates remain the authority) — running at "on" to surface on real reviews.
# Rollback: "shadow" (telemetry only) or "off" (inert).
OPENCLAW_SYNTH_RECOVERY = "on"

# SIG-317 step 6 Part A: deterministic AST-emit injection floor. Force-surfaces an
# `emitWhenUnmatched` (warning/info) AST finding the synth crowded out of its
# verdict tail — the proven subtle needle (cents-as-dollars, enum/contract drift,
# fractional-cents, dynamic-HTML-sink) that gets buried under severity-first
# ranking. Cites the astFindingId (SIG-314 admits it) so it flows through every
# post-synth gate; P2/P3-capped (an error security sink sorts first + has the
# SIG-309 path, so it's never the crowd-out victim and stays out of scope).
# Recall-positive (only ADDS findings, can't hide). Shadow-first: logs the
# `pr-review-ast-emit-floor-injected` event WITH the projected headline/body so
# the believability can be audited. ⚠️ DO NOT flip "on" until step 6 Part B
# (AST-evidence render) ships — a raw AST message at score 2-3 reads as linter
# noise and would erode believability (dual sign-off). The `on` flip is gated on
# (a) Part B landed AND (b) the shadow would-inject sample being genuine proven
# needles, not noise. Rollback: "shadow" or "off".
OPENCLAW_AST_EMIT_FLOOR = "shadow"

# SIG-317 Part 4b (2026-06-02): cross-function asymmetry hints for the LOGIC
# specialist — the evidence injector. Surfaces a deterministic FACT (a function
# that mutates table T but bypasses the aggregation helper over T that other code
# uses = a likely over-credit/over-refund, e.g. refundCharge skipping
# refundsTotal) into the logic prompt for the model to judge. NOT a posted
# finding — but it NUDGES the specialist, so unlike a pure detector it carries an
# induced-FP risk and ships SHADOW-FIRST. "off" (default) inert, "shadow" logs the
# `pr-review-asymmetry-hints` count, "on" injects. pr/11 D8 A/B (2026-06-02): the
# fact REACHED the model (its reasoning traced downgradeCredit->amount_cents->the
# helper SUM) but it deflected to a rounding/units judgment and missed the
# repeatable over-credit. Reverted to "shadow" + retargeted the hint message at the
# over-credit SEMANTICS; re-measure on the next over-credit benchmark before "on".
# 2026-06-02: message hardened (#311: append-only + anti-reclassification branches,
# real identifiers) + dual-signed-off + offline non-regression clean → flipped "on"
# for the live pr/12 over-credit A/B. Rollback path = "shadow".
OPENCLAW_ASYMMETRY_HINTS = "on"

# SIG-317 Part 4b-v2: the TOCTOU / check-then-act race evidence-injector. Same
# shadow-first ladder as the over-credit injector above. Detects SELECT-of-C ->
# JS value-guard -> separate `UPDATE T SET C = C +/- N` with no atomic guard (the
# addSeat race), silent on the atomic-WHERE / FOR UPDATE / ON CONFLICT / CAS /
# SERIALIZABLE / advisory-lock / DurableObject variants. "shadow" logs the
# `pr-review-toctou-hints` count (no inject); flip to "on" gated on a clean
# race-benchmark + the SIG-245 zero-P1-FP window.
# 2026-06-03: flipped "on" for the live pr/13 race A/B (reserveStock + claimCoupon
# racy, bumpViewCount fires-but-safe). Rollback path = "shadow".
OPENCLAW_TOCTOU_HINTS = "on"

# SIG-184 runner-evidence ("defensible receipt") go-live (2026-05-30, founder-
# authorized). The first two un-503 the POST /runner/ingest route so the runner
# can deposit receipts; the third turns on consumption.
#   OPENCLAW_RUNNER_OIDC_AUDIENCE  — the `aud` the runner mints its OIDC token
#     with; the ingest route requires the token's `aud` to equal this. Stable
#     opaque id (domain-independent) so a future custom domain doesn't break
#     every caller workflow. The caller's `oidc-audience:` input MUST match.
#   OPENCLAW_RUNNER_WORKFLOW_REF   — Sigilix's pinned reusable workflow as
#     `owner/repo/path` (NO @ref). The token's `job_workflow_ref` path part must
