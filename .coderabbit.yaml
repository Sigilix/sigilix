language: en-US
tone_instructions: >
  Be direct and specific. Focus on architectural risk and maintainability.
  Keep PR review comments concise: flag the problem and suggest a fix.
  Do not add story points, type classifications, label suggestions, or issue-triage metadata to PR reviews.
reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  high_level_summary_in_walkthrough: false
  poem: false
  review_status: true
  collapse_walkthrough: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  tools:
    biome:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000
  auto_review:
    enabled: true
    drafts: false
    # CodeRabbit only auto-reviews PRs whose base is the default branch (main)
    # OR is listed here. Without `dev`, the integration branch sees
    # "Auto reviews are disabled on base/target branches other than the
    # default branch" — see PR #129. Adding `dev` so feature → dev PRs get
    # reviewed without manually invoking @coderabbitai review.
    base_branches:
      - dev
  path_instructions:
    - path: "app/src/services/**"
      instructions: |
        Service files are the only Supabase interface. Components must never call Supabase directly.
        Check that all inserts include user_id for RLS compliance.
        Flag any raw SQL or unparameterized queries as a security issue.
    - path: "app/src/contexts/**"
      instructions: |
        Auth logic lives here. signInWithGoogle handles both web redirect and Electron popup flows.
        Verify no auth logic leaks into components.
        Flag any hardcoded tokens, secrets, or credentials.
    - path: "app/electron/**"
      instructions: |
        Electron main process code. Check for:
        - Context isolation must be enabled
        - No nodeIntegration in renderers
        - Proper IPC channel validation via ALLOWED_CHANNELS
        - No shell.openExternal with unvalidated URLs
        - No global variable usage for sensitive state (tokens, verifiers)
    - path: "app/src/stores/**"
      instructions: "Zustand stores. They call services, never Supabase directly. Check that duplicate type definitions are imported from services, not redefined."
    - path: "app/src/components/**"
      instructions: "React components should never import supabase directly. All data access goes through stores or contexts."
    - path: "app/src/**/*.ts"
      instructions: |
        TypeScript source files. Check for:
        - Proper type safety — no unnecessary `any` or type assertions
        - Consistent error handling patterns
        - Functions that are too large should be decomposed
    - path: "app/src/**/*.tsx"
      instructions: |
        React component files. Check for:
        - Components should be focused and single-responsibility
        - No direct Supabase imports — use stores or services
        - Proper memoization where performance matters
    - path: "supabase/migrations/**"
      instructions: |
        Database migrations. Verify:
        - RLS policies use auth.uid() = user_id
        - No USING (true) policies allowed
        - All new tables have RLS enabled
        - All new data tables include user_id column
    - path: "**/.env*"
      instructions: "Environment files should never be committed. Flag this immediately."
chat:
  auto_reply: false
knowledge_base:
  issues:
    scope: local
  pull_requests:
    scope: local
issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: false
    auto_planning:
      enabled: false
  labeling:
    # Auto-labeling is intentionally disabled — issue triage / labeling
    # runs out-of-band and CodeRabbit applying labels here caused duplicates
    # and unwanted tags (e.g. `request`, `intern`) to re-appear on issues.
    auto_apply_labels: false
    labeling_instructions:
      - label: request
        instructions: Apply when the issue is clearly client-requested work or a stakeholder asks for a new change.
      - label: intern
        instructions: Apply when the issue is tightly scoped, low-risk, and appropriate for an intern to implement with review.
      - label: performance
        instructions: Apply when the issue focuses on runtime speed, rendering responsiveness, memory use, heavy computations, or large data handling.
      - label: cut-planner
        instructions: Apply when the issue touches packing logic, nesting, layout generation, cut plans, or geometry placement behavior.
      - label: refactor
        instructions: Apply when the main goal is structural cleanup, maintainability, or internal simplification without changing product scope.
      - label: ui
        instructions: Apply when the issue mainly changes visible workflows, controls, layouts, styling, or interaction design.
