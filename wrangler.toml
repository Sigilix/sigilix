# Worker name — drives the deploy URL (e.g.
# `sigilix.<account>.workers.dev`) and is what GitHub / Linear webhook
# configs point at. Renamed from `openclaw-worker` during the Sigilix
# rebrand. KV/Queue/Vectorize binding NAMES still use the legacy
# `OPENCLAW_*` prefix (deferred to a follow-up to avoid churning ~100
# `env.OPENCLAW_*` references in code in the same PR — bindings are
# internal, not user-visible, so the visible-surface rebrand can ship
# first).
name = "sigilix"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# Standard usage model — Bundled gives ctx.waitUntil() only ~30s of
# wall-clock budget after the response, which Ollama Turbo blows past
# routinely (its calls take 30-90s for a description rewrite). On
# Standard we get up to 30 min of waitUntil time and an explicit CPU
# budget in milliseconds, which is what the triage path needs.
#
# The legacy `usage_model = "unbound"` directive was removed in
# wrangler 4 and is silently ignored — the Worker was actually
# running on the Bundled default, which was killing waitUntil mid-
# triage and leaving every test issue with no comment / no rewrite.
[limits]
cpu_ms = 300000

# KV namespace for dedupe state.
# Stores marker comment IDs by issue identifier so re-firing
# webhooks edit-in-place instead of duplicating triage comments.
# Replaces the file-on-disk poll-state.json the Node daemon used.
#
# Run once: `wrangler kv:namespace create OPENCLAW_STATE`
# Then paste the returned ID below.
[[kv_namespaces]]
binding = "OPENCLAW_STATE"
id = "df689379ea6240f7808997a75ceaed7e"

# Vectorize index for codebase chunks. Embeddings are 768-dim vectors
# from Cloudflare's @cf/baai/bge-base-en-v1.5, indexed under one
# namespace per repo (e.g. "rubberfit", "rubberfit-desktop") so
# triage on a Linear issue can scope retrieval to the relevant repo.
#
# Run once: `wrangler vectorize create openclaw-code-index \
#   --dimensions=768 --metric=cosine`
# Then populate via scripts/index-repo.mjs (see README).
[[vectorize]]
binding = "OPENCLAW_CODE_INDEX"
index_name = "openclaw-code-index"

# Cloudflare Workers AI binding — used for embedding the issue/comment
# body at query time. Keeps the embedding model identical between
# index time (CLI/CI script also calls @cf/baai/bge-base-en-v1.5 via
# the REST API) and retrieval time, which is critical for cosine sim
# to be meaningful.
[ai]
binding = "AI"

# Cloudflare Queue — `ctx.waitUntil()` has a hard 30s cap that's not
# configurable on any plan, and Ollama Turbo calls (Kimi/GLM) routinely
# take 30-90s. Webhooks now enqueue a JobMessage and return 200 fast
# (~50ms); the queue consumer below processes the job with up to 15
# minutes of wall-clock time per Cloudflare's documented limits.
#
# Run once before first deploy:
#   npx wrangler queues create openclaw-jobs
#
# Producer binding — the fetch handler `.send()`s here.
[[queues.producers]]
binding = "OPENCLAW_JOBS"
queue = "openclaw-jobs"

# Consumer binding — DEFERRED out of wrangler.toml because Cloudflare's
# Queue API rejects re-registering a consumer that's already bound to
# this same script (HTTP 11004 — "Queue already has a consumer"), and
# the CF Workers Builds CI re-runs `wrangler deploy` on every push. The
# initial registration was done once via `wrangler deploy` from a local
# checkout after the openclaw-worker → sigilix cutover; subsequent
# deploys must not try to re-register, or CI fails.
#
# The consumer is still active — bound at the dashboard / queue level,
# not at deploy time. `src/index.ts` still exports a `queue()` handler
# that processes openclaw-jobs messages.
#
# To rebind manually if it ever comes loose:
#   npx wrangler queues consumer add openclaw-jobs sigilix \
#     --batch-size 1 --max-concurrency 5 --max-retries 3 --batch-timeout 1
# Or via dashboard: Workers & Pages → openclaw-jobs (queue) → Settings
# → Consumers → Add consumer → pick `sigilix`.
#
# [[queues.consumers]]
# queue = "openclaw-jobs"
# max_batch_size = 1
# max_concurrency = 5
# max_retries = 3
# max_batch_timeout = 1

# Required secrets (set via `wrangler secret put`):
#
#   LINEAR_API_KEY                Personal API key — used as the manual-trigger
#                                 route's bearer secret AND as the Linear API
#                                 fallback when OAuth isn't configured.
#                                 Linear → Settings → API → Personal API keys
#   LINEAR_WEBHOOK_SECRET         Signing secret from the Linear webhook config.
#                                 Used to verify the HMAC on every webhook delivery.
#   OLLAMA_API_KEY                Ollama Turbo API key (https://ollama.com/settings/keys)
#
# Optional (recommended for production — gives the Worker its own bot identity):
#
#   LINEAR_OAUTH_CLIENT_ID        OAuth app client_id from Linear → Settings →
#   LINEAR_OAUTH_CLIENT_SECRET    API → OAuth applications. Together they let
#                                 the Worker mint a 30-day app-actor token via
#                                 client_credentials. Comments and field
#                                 updates then appear as the OAuth app rather
#                                 than the human owner of LINEAR_API_KEY.
#
# Required for the GitHub webhook routes (PR overview, CI triage, CR eval,
# proactive PR review). Without these the /github/webhook route returns 503
# — we never want to fall back to a developer's PAT for PR-side actions.
#
#   GITHUB_APP_ID                 Numeric App ID from
#                                 https://github.com/organizations/Arc-and-Anchor/settings/apps/<app-name>
#   GITHUB_PRIVATE_KEY            PEM-encoded RSA private key (PKCS#1 or PKCS#8).
#                                 GitHub's "Generate a private key" button
#                                 downloads PKCS#1 — paste it as-is.
#   GITHUB_WEBHOOK_SECRET         HMAC secret on the App's webhook config.
#                                 Used to verify X-Hub-Signature-256 on every
#                                 inbound delivery.
#
# Required GitHub App permissions:
#   Repository → Actions: Read       (CI logs)
#   Repository → Contents: Read      (file contents at a given ref)
#   Repository → Issues: Write       (top-level PR comments)
#   Repository → Pull requests: R/W  (PR diff, review comments, submit review)
#   Repository → Metadata: Read      (default)
#
# Required GitHub App webhook events:
#   pull_request                  (opened, synchronize, ready_for_review, reopened)
#   workflow_run                  (CI failure triage)
#   issue_comment                 (top-level PR conversation @-mentions)
#   pull_request_review_comment   (inline PR review comment @-mentions)
#
# Optional (other):
#   OPENCLAW_MODEL                Override the default model (defaults to glm-5.1:cloud)
#   OPENCLAW_TEAM_KEY             Linear team key to scope to (e.g. "ARC")
#
# Optional (Phase 5 user-OAuth — required only for /auth/* routes; if
# unset, /auth/github + /auth/github/callback return 503 and the rest
# of the Worker is unaffected). See `.claude/handoff/arc-phase5-auth-spec-v2-LOCKED.md`.
#
#   GITHUB_OAUTH_CLIENT_ID        OAuth client_id from the same GitHub App as
#   GITHUB_OAUTH_CLIENT_SECRET    GITHUB_APP_ID. The App settings page exposes
#                                 both server-to-server (JWT, used for repo
#                                 access) AND user-to-server (OAuth, used to
#                                 sign humans into the app.sigilix.ai dashboard).
#   OPENCLAW_SESSION_ENCRYPTION_KEY  32 random bytes, base64url-encoded. Used to
#                                 AES-GCM-encrypt user access tokens at rest in
#                                 OPENCLAW_STATE. Generate with:
#                                 openssl rand 32 | basenc --base64url -w0
#                                 Rotating this invalidates every active session.
#   OPENCLAW_BASE_URL             Public origin for OAuth callbacks (must match
#                                 the GitHub App's configured callback URL).
#                                 Defaults to https://app.sigilix.ai when unset.
#
# GitHub App callback URL (required for OAuth): set on the App settings page →
# Identifying and authorizing users → User authorization callback URL:
#   https://app.sigilix.ai/auth/github/callback

# Cloudflare Workers Logs — keep the full Workers Observability product
# disabled (it costs per-event ingest) but turn on `invocation_logs` so
# every webhook delivery still produces a head-sampled request line that
# `wrangler tail` and the dashboard can show. Without this, the Worker
# fires silently and triage failures are invisible.
[observability.logs]
enabled = false
invocation_logs = true

# Environment-specific overrides go below as `[env.production]`,
# `[env.staging]`, etc. The default config above is what `wrangler deploy`
# uses when no `--env` flag is passed.
