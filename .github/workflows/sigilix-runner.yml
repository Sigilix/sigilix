name: Sigilix runner evidence

# SIG-184 dogfood: run Sigilix's deterministic-scan reusable workflow on this
# repo's own PRs so the worker receives a GitHub-signed receipt and the review
# renders the "verified" trust pill. Best-effort + non-blocking — the reusable
# workflow never fails the caller's CI, and an absent receipt simply yields no
# pill. Pinned to a commit SHA (supply-chain safety): bump on each runner change.

on:
  pull_request:

# Restrictive workflow-level default (read-only). The id-token:write grant the
# receipt needs is scoped to the `evidence` job ONLY (jobs.evidence.permissions
# below), so no other / future job in this workflow inherits token-mint power.
permissions:
  contents: read

# Cancel a superseded run when a newer commit is pushed to the same PR — the
# receipt only needs to reflect the latest head.
concurrency:
  group: sigilix-runner-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence:
    permissions:
      contents: read
      id-token: write
    uses: Sigilix/runner/.github/workflows/scan.yml@09bc0b1f92b6e25279c6b7e3670ad79ea924f270
    with:
      ingest-url: https://sigilix.dan-martinezjulio.workers.dev/runner/ingest
      oidc-audience: sigilix-runner-ingest
      # The runner is Sigilix's DETERMINISTIC lane (the LLM specialists handle
      # logic/perf/etc.). A focused security ruleset is higher-signal than
      # `--config auto` AND much smaller — `auto` on this repo overran the 8 MiB
      # ingest cap (SIG-184 413). Deterministic tools are strongest at security.
      semgrep-config: p/security-audit
