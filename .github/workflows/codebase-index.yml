name: Index codebase to Vectorize (reusable)

# Reusable workflow that other repos in the Arc-and-Anchor org call from
# their own `on: push` workflows to auto-reindex into the Sigilix
# Vectorize index. The caller passes its repo via the standard checkout
# step; this workflow checks out the indexer separately, runs it
# against the caller's source tree, and upserts vectors into the
# namespace named after the calling repo (lowercased).
#
# Caller pattern (drop this into each tracked repo at
# `.github/workflows/openclaw-index.yml`):
#
#   name: OpenClaw codebase index
#   on:
#     push:
#       branches: [dev, main]
#     workflow_dispatch:
#   jobs:
#     index:
#       uses: Arc-and-Anchor/sigilix/.github/workflows/codebase-index.yml@main
#       secrets:
#         CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
#         CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
#         OPENCLAW_REPO_TOKEN: ${{ secrets.OPENCLAW_REPO_TOKEN }}
#
# (When sigilix is the caller, `openclaw-index.yml` self-references via
# `./.github/workflows/codebase-index.yml` instead — `uses:` does not
# follow GitHub's rename redirects, so an absolute reference to
# `Arc-and-Anchor/openclaw-worker/...` 404s after the rename.)
#
# Note: triggers on push to dev OR main. dev is the active development
# branch; main is customer-facing. Both reindex into the same namespace
# (`<repo-name>` lowercased) — whichever branch changed last wins,
# matching what the team is actually working on at any given moment.
#
# Required org-level secrets (configured at
# https://github.com/organizations/Arc-and-Anchor/settings/secrets/actions
# with visibility:all so every calling repo can read them):
#
#   CLOUDFLARE_ACCOUNT_ID    Cloudflare account UUID
#   CLOUDFLARE_AI_TOKEN      API token with Workers AI:Read + Vectorize:Edit
#   OPENCLAW_REPO_TOKEN      Fine-grained PAT with Contents:Read on
#                            Arc-and-Anchor/sigilix. Required because the
#                            runner's default GITHUB_TOKEN is scoped to the
#                            calling repo only and can't clone the private
#                            indexer source repo. Without it the second
#                            checkout step fails with "Repository not found."
#                            If this PAT was originally scoped to
#                            openclaw-worker, re-scope it to sigilix; the
#                            indexer-source checkout below now uses the
#                            new repo name.

on:
  workflow_call:
    inputs:
      namespace:
        description: Vectorize namespace to upsert into. Defaults to the lowercased calling repo name.
        type: string
        required: false
        default: ""
      target_ref:
        description: Ref of the calling repo to index. Defaults to the ref that triggered the caller.
        type: string
        required: false
        default: ""
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      # Fine-grained PAT with Contents:Read on Arc-and-Anchor/sigilix.
      # See header comment for why this is needed.
      OPENCLAW_REPO_TOKEN:
        required: true

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          path: target-repo
          fetch-depth: 1

      - name: Checkout sigilix (indexer source)
        uses: actions/checkout@v4
        with:
          repository: Arc-and-Anchor/sigilix
          ref: main
          path: indexer-source
          fetch-depth: 1
          # The default GITHUB_TOKEN is scoped to the calling repo and
          # can't read this private indexer repo. The fine-grained PAT
          # at OPENCLAW_REPO_TOKEN has Contents:Read on sigilix.
          token: ${{ secrets.OPENCLAW_REPO_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: indexer-source/package-lock.json

      - name: Install indexer deps
        working-directory: indexer-source
        run: npm ci

      - name: Run indexer
        working-directory: indexer-source
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Default the namespace to the caller's repo name (lowercased).
          # The indexer does its own lowercasing, but doing it here too
          # keeps the log line accurate and matches what `OPENCLAW_TEAM_REPO_MAP`
          # expects on the Worker side.
          NAMESPACE_INPUT="${{ inputs.namespace }}"
          if [ -z "$NAMESPACE_INPUT" ]; then
            NAMESPACE_INPUT="${{ github.event.repository.name }}"
          fi
          NAMESPACE_LOWER="$(printf '%s' "$NAMESPACE_INPUT" | tr '[:upper:]' '[:lower:]')"
          node scripts/index-repo.mjs ../target-repo --namespace="$NAMESPACE_LOWER"
