name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint (size budget, ../ ban, no warnings)
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: Dependency rules (inward-only, barrel-only)
        run: npm run depcruise

      - name: Unit tests
        run: npm test

      - name: ARC-186 advisory DB size check
        run: npm run check:advisory-db-size
